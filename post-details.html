<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Discussion | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .post-wrap { max-width: 680px; margin: 0 auto; }
    .comment-item {
      padding: 14px 0;
      border-bottom: 1px solid #ECECEC;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-author-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
    }
    .comment-author {
      font-weight: 700;
      color: var(--deep-forest);
    }
    .comment-time {
      color: var(--secondary-text);
      font-size: 0.75rem;
    }
    .comment-text {
      font-size: 0.92rem;
      color: var(--primary-text);
      line-height: 1.45;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="post-wrap">
        <a href="blog.html" style="color: var(--primary-green); font-size: 0.85rem; font-weight: 600; text-decoration: none; display: inline-block; margin-bottom: 16px;">
          ← Back to Community Feed
        </a>

        <!-- Main Post Card -->
        <div class="astra-card" id="postContentCard" style="margin-bottom: 24px;">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading post...</p>
        </div>

        <!-- Comments Section -->
        <div class="astra-card">
          <h3 style="font-size: 1.15rem; color: var(--deep-forest); margin-bottom: 14px;" id="commentsHeading">
            Discussion &amp; Comments
          </h3>

          <!-- Add Comment Form -->
          <form id="commentForm" style="display: flex; gap: 8px; margin-bottom: 20px;">
            <input type="text" id="commentInput" class="form-control" style="flex: 1; padding: 12px 14px; border: 1px solid #D1D5DB; border-radius: var(--radius-sm);" placeholder="Write a comment..." required maxlength="300" autocomplete="off">
            <button type="submit" id="commentBtn" class="btn-gold" style="padding: 12px 20px; font-size: 0.88rem; flex-shrink: 0;">Send</button>
          </form>

          <!-- Comments Feed (Newest first) -->
          <div id="commentsList">
            <p style="color: var(--secondary-text); font-size: 0.85rem; text-align: center; padding: 20px;">Loading comments...</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { fetchUsernames } from './shared/usernames.js';
    import { formatDate } from './shared/formatters.js';

    let currentUserId = null;
    let targetPostId = null;

    async function loadPostDetails() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;
      currentUserId = session.user.id;

      const urlParams = new URLSearchParams(window.location.search);
      targetPostId = urlParams.get('id');

      const card = document.getElementById('postContentCard');
      if (!targetPostId) {
        card.innerHTML = `<p style="color: var(--error-red); text-align: center;">No post identifier provided.</p>`;
        return;
      }

      const { data: post, error } = await supabase
        .from('blog_posts')
        .select(`
          id, user_id, title, content, caption, image_url, likes_count, comments_count, bonus_awarded, created_at
        `)
        .eq('id', targetPostId)
        .maybeSingle();

      if (error || !post) {
        card.innerHTML = `<p style="color: var(--error-red); text-align: center;">Post not found or pending review.</p>`;
        return;
      }

      const author = (await fetchUsernames([post.user_id])).get(post.user_id) || 'Investor';

      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <div>
            <strong style="color: var(--deep-forest); font-size: 1rem;">@${escapeHtml(author)}</strong>
            <span style="font-size: 0.75rem; color: var(--secondary-text); display: block;">${formatDate(post.created_at)}</span>
          </div>
          ${post.bonus_awarded ? `<span class="badge-status badge-completed">✦ Verified Bonus Awarded</span>` : ''}
        </div>

        <h1 style="font-size: 1.4rem; color: var(--deep-forest); margin-bottom: 12px;">${escapeHtml(post.title)}</h1>
        <p style="font-size: 0.95rem; color: var(--primary-text); line-height: 1.6; white-space: pre-wrap;">${escapeHtml(post.content)}</p>

        ${post.image_url ? `
          <img src="${post.image_url}" alt="Proof receipt" style="width: 100%; max-height: 440px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid #E5E7EB; margin-top: 14px; background: #000; cursor: pointer;" onclick="window.open('${post.image_url}', '_blank')">
        ` : ''}

        ${post.caption ? `
          <p style="font-size: 0.85rem; color: var(--secondary-text); font-style: italic; margin-top: 10px;">"${escapeHtml(post.caption)}"</p>
        ` : ''}
      `;

      loadComments();
    }

    async function loadComments() {
      const container = document.getElementById('commentsList');

      // Order with ascending: false so NEWEST comments appear at the top
      const { data: comments, error } = await supabase
        .from('blog_comments')
        .select(`id, user_id, comment, created_at`)
        .eq('post_id', targetPostId)
        .order('created_at', { ascending: false });

      if (error || !comments || comments.length === 0) {
        document.getElementById('commentsHeading').textContent = 'Discussion & Comments (0)';
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); font-size: 0.85rem; padding: 14px;">No comments yet. Share your thoughts above!</p>`;
        return;
      }

      document.getElementById('commentsHeading').textContent = `Discussion & Comments (${comments.length})`;

      const usernames = await fetchUsernames(comments.map(c => c.user_id));
      container.innerHTML = comments.map(c => {
        const name = usernames.get(c.user_id) || 'Investor';
        return `
          <div class="comment-item">
            <div class="comment-author-row">
              <span class="comment-author">@${escapeHtml(name)}</span>
              <span class="comment-time">${formatDate(c.created_at)}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.comment)}</div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('commentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('commentInput');
      const btn = document.getElementById('commentBtn');
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      btn.textContent = 'Posting...';

      const { error } = await supabase
        .from('blog_comments')
        .insert({
          post_id: targetPostId,
          user_id: currentUserId,
          comment: text
        });

      btn.disabled = false;
      btn.textContent = 'Send';

      if (error) {
        alert('Failed to post comment: ' + error.message);
      } else {
        input.value = '';
        // Reload comments immediately to show the new comment at the top
        loadComments();
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadPostDetails();
  </script>
</body>
</html>
