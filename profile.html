<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .profile-box { max-width: 640px; margin: 0 auto; }
    .avatar-crest {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--card-green) 0%, var(--primary-green) 100%);
      border: 2px solid var(--metallic-gold);
      color: var(--bright-gold);
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .form-control {
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
    .form-control[readonly] { background: #F3F4F6; color: var(--secondary-text); cursor: not-allowed; }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="profile-box">
        <h1 class="font-heading" style="font-size: 1.8rem; margin-bottom: 20px;">Investor Profile</h1>

        <div id="alertBanner" class="alert-banner"></div>

        <div class="astra-card">
          <div style="display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #ECECEC; padding-bottom: 20px; margin-bottom: 20px;">
            <div class="avatar-crest" id="avatarDisplay">A</div>
            <div>
              <h2 id="nameHeading" style="font-size: 1.3rem; color: var(--deep-forest);">Loading...</h2>
              <div style="display: flex; gap: 8px; margin-top: 4px;">
                <span class="badge-status badge-completed" id="vipDisplay">Standard Member</span>
                <span class="badge-status badge-pending">Active Account</span>
              </div>
            </div>
          </div>

          <form id="profileForm">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" class="form-control" required maxlength="120">
            </div>

            <div class="form-group">
              <label for="username">Username (Immutable)</label>
              <input type="text" id="username" class="form-control" readonly>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" class="form-control" readonly>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-control" required maxlength="20">
            </div>

            <div class="form-group">
              <label for="refCode">Referral Code</label>
              <input type="text" id="refCode" class="form-control" readonly>
            </div>

            <div class="form-group">
              <label for="joinedDate">Member Since</label>
              <input type="text" id="joinedDate" class="form-control" readonly>
            </div>

            <button type="submit" id="saveBtn" class="btn-gold" style="width: 100%; padding: 13px; margin-top: 8px;">
              Save Profile Changes
            </button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatDate } from './shared/formatters.js';

    let currentUserId = null;

    async function loadProfile() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;
      currentUserId = session.user.id;

      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUserId)
        .single();

      if (profile) {
        document.getElementById('fullName').value = profile.full_name || '';
        document.getElementById('username').value = profile.username || '';
        document.getElementById('email').value = session.user.email || '';
        document.getElementById('phone').value = profile.phone || '';
        document.getElementById('refCode').value = profile.referral_code || '';
        document.getElementById('joinedDate').value = formatDate(profile.created_at, { includeTime: false });

        const displayName = profile.full_name || profile.username || 'Investor';
        document.getElementById('nameHeading').textContent = displayName;
        document.getElementById('avatarDisplay').textContent = displayName.charAt(0).toUpperCase();

        if (profile.astra_vip_level > 0) {
          document.getElementById('vipDisplay').textContent = `✦ VIP ${profile.astra_vip_level}`;
        }
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertBanner = document.getElementById('alertBanner');
      const saveBtn = document.getElementById('saveBtn');
      alertBanner.style.display = 'none';

      const fullName = document.getElementById('fullName').value.trim();
      const phone = document.getElementById('phone').value.trim();

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const { data, error } = await supabase.rpc('update_user_profile', {
        p_user_id: currentUserId,
        p_full_name: fullName,
        p_phone: phone
      });

      saveBtn.disabled = false;
      saveBtn.textContent = 'Save Profile Changes';

      if (error || !data.success) {
        alertBanner.textContent = data?.error || error?.message || 'Profile update failed.';
        alertBanner.className = 'alert-banner error';
      } else {
        alertBanner.textContent = 'Profile updated successfully!';
        alertBanner.className = 'alert-banner success';
        document.getElementById('nameHeading').textContent = fullName;
      }
    });

    loadProfile();
  </script>
</body>
</html>
