<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTRA-VIP Packages | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .page-header {
      margin-bottom: 24px;
    }
    .page-lead {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--primary-green);
      font-weight: 700;
    }
    .page-title {
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--deep-forest);
      margin-top: 2px;
    }
    .catalog-search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: var(--radius-sm);
      background: var(--white);
      font-size: 0.9rem;
    }
    .products-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    @media (min-width: 650px) {
      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (min-width: 1100px) {
      .products-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    .product-card {
      background: linear-gradient(135deg, #002B1A 0%, #003D24 100%);
      border: 1.5px solid var(--metallic-gold);
      border-radius: var(--radius-md);
      padding: 20px;
      color: var(--white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: var(--shadow-sm);
    }
    .product-card.inactive {
      opacity: 0.72;
      border-color: #6B7280;
      background: linear-gradient(135deg, #1A2621 0%, #20332B 100%);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .vip-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--bright-gold);
      text-transform: uppercase;
    }
    .prod-name {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      color: var(--white);
      margin: 4px 0 12px;
    }
    .price-tag {
      font-size: 1.6rem;
      font-weight: 700;
      font-family: var(--font-heading);
      color: var(--bright-gold);
      margin-bottom: 14px;
    }
    .terms-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 0.82rem;
    }
    .term-label {
      color: var(--secondary-text);
      font-size: 0.72rem;
      text-transform: uppercase;
    }
    .term-value {
      color: var(--white);
      font-weight: 600;
      margin-top: 2px;
    }
    .card-actions {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="page-header">
        <span class="page-lead">✦ Premier Flight Portfolios</span>
        <h1 class="page-title">ASTRA-VIP Packages</h1>
        <p style="color: var(--secondary-text); font-size: 0.9rem; margin-top: 4px;">
          Verified commercial aviation tiers distributing daily automated settlements.
        </p>
      </div>

      <div class="catalog-search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Search VIP packages...">
      </div>

      <div class="products-grid" id="productsContainer">
        <div class="astra-card" style="text-align: center; padding: 40px;">
          <p style="color: var(--secondary-text);">Loading ASTRA-VIP packages...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatCurrency } from './shared/formatters.js';

    let allProducts = [];

    async function loadVipProducts() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;

      const { data: category } = await supabase
        .from('product_categories')
        .select('id')
        .eq('slug', 'vip')
        .single();

      if (!category) return;

      const { data: products, error } = await supabase
        .from('products')
        .select('*')
        .eq('category_id', category.id)
        .order('price', { ascending: true });

      const container = document.getElementById('productsContainer');

      if (error || !products || products.length === 0) {
        container.innerHTML = `
          <div class="astra-card" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
            <p style="color: var(--secondary-text);">No VIP packages available at this time.</p>
          </div>
        `;
        return;
      }

      allProducts = products;
      renderProducts(allProducts);

      document.getElementById('searchInput').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query));
        renderProducts(filtered);
      });
    }

    function renderProducts(list) {
      const container = document.getElementById('productsContainer');
      if (list.length === 0) {
        container.innerHTML = `<div class="astra-card" style="grid-column: 1 / -1; text-align: center; padding: 30px;"><p style="color: var(--secondary-text);">No packages match your search.</p></div>`;
        return;
      }

      container.innerHTML = list.map(prod => `
        <div class="product-card ${!prod.is_active ? 'inactive' : ''}">
          <div>
            <div class="card-top">
              <span class="vip-tag">${prod.code}</span>
              <span class="badge-status ${prod.is_active ? 'badge-completed' : 'badge-pending'}">
                ${prod.is_active ? 'Active' : 'Coming Soon'}
              </span>
            </div>
            <h2 class="prod-name">${prod.name}</h2>
            <div class="price-tag">${formatCurrency(prod.price)}</div>

            <div class="terms-grid">
              <div>
                <div class="term-label">Cycle Duration</div>
                <div class="term-value">${prod.duration_days} Days</div>
              </div>
              <div>
                <div class="term-label">Daily Settlement</div>
                <div class="term-value" style="color: var(--bright-gold);">${formatCurrency(prod.daily_income)}</div>
              </div>
              <div>
                <div class="term-label">Total Revenue</div>
                <div class="term-value">${formatCurrency(prod.total_payout)}</div>
              </div>
              <div>
                <div class="term-label">Return Yield</div>
                <div class="term-value" style="color: var(--success-green);">+${Math.round(((prod.total_payout - prod.price) / prod.price) * 100)}%</div>
              </div>
            </div>
          </div>

          <div class="card-actions">
            <a href="vip-details.html?id=${prod.id}" class="btn-emerald" style="flex: 1; padding: 10px;">Details</a>
            ${prod.is_active ? `
              <a href="invest.html?product_id=${prod.id}" class="btn-gold" style="flex: 1; padding: 10px;">Invest</a>
            ` : `
              <button class="btn-emerald" disabled style="flex: 1; padding: 10px; opacity: 0.5; cursor: not-allowed;">Closed</button>
            `}
          </div>
        </div>
      `).join('');
    }

    loadVipProducts();
  </script>
</body>
</html>
