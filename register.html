<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Investor Account | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at center, var(--cream-white) 0%, #F5EEDB 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--metallic-gold);
      box-shadow: var(--shadow-lg);
      padding: 36px 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .form-control {
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="index.html" class="brand-wordmark" style="font-size: 2rem; text-decoration: none; display: inline-block;">ASTRAVEN</a>
        <p style="color: var(--secondary-text); font-size: 0.9rem; margin-top: 4px;">Open your verified investment account</p>
      </div>

      <div id="alertBanner" class="alert-banner"></div>

      <form id="regForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="johndoe" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" class="form-control" placeholder="08012345678" required>
        </div>

        <div class="form-group">
          <label for="password">Password (Min. 8 characters)</label>
          <input type="password" id="password" class="form-control" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat password" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="referralCode">Referral Code (Optional)</label>
          <input type="text" id="referralCode" class="form-control" placeholder="e.g. ASTRA1234">
        </div>

        <button type="submit" id="submitBtn" class="btn-gold" style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 8px;">
          Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--secondary-text);">
        Already have an account? <a href="login.html" style="color: var(--primary-green); font-weight: 700; text-decoration: none;">Sign In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabase-client.js';
    import { isValidEmail, isValidNigerianPhone } from './shared/validation.js';

    const form = document.getElementById('regForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');
    const refInput = document.getElementById('referralCode');

    // Auto-fill referral code from query params
    const urlParams = new URLSearchParams(window.location.search);
    const refParam = urlParams.get('ref');
    if (refParam) refInput.value = refParam.trim().toUpperCase();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const fullName = document.getElementById('fullName').value.trim();
      const username = document.getElementById('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
      const email = document.getElementById('email').value.trim().toLowerCase();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const referralCode = refInput.value.trim().toUpperCase();

      if (!isValidEmail(email)) {
        alertBanner.textContent = 'Please provide a valid email address.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      if (!isValidNigerianPhone(phone)) {
        alertBanner.textContent = 'Please enter a valid Nigerian phone number (e.g. 08012345678).';
        alertBanner.className = 'alert-banner error';
        return;
      }

      if (password.length < 8) {
        alertBanner.textContent = 'Password must be at least 8 characters long.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      if (password !== confirmPassword) {
        alertBanner.textContent = 'Passwords do not match.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Registering...';

      try {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName,
              username: username,
              phone: phone,
              referral_code: referralCode
            }
          }
        });

        if (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
          alertBanner.textContent = error.message;
          alertBanner.className = 'alert-banner error';
          return;
        }

        if (data.session) {
          window.location.href = 'dashboard.html';
        } else {
          alertBanner.textContent = 'Registration completed! Please check your email inbox to verify your account before logging in.';
          alertBanner.className = 'alert-banner success';
          form.reset();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }

      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
        alertBanner.textContent = 'Registration service error. Please try again.';
        alertBanner.className = 'alert-banner error';
      }
    });
  </script>
</body>
</html>
