<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSVIP Maturity Portfolios | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .page-header { margin-bottom: 24px; }
    .page-title { font-size: clamp(1.4rem, 4vw, 2rem); color: var(--deep-forest); }
    .grid-ssvip {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    @media (min-width: 650px) {
      .grid-ssvip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="page-header">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Fixed Maturity Model</span>
        <h1 class="page-title">SSVIP Capital Growth</h1>
        <p style="color: var(--secondary-text); font-size: 0.9rem;">
          Lump-sum capital and total return credited directly upon completion of the maturity term.
        </p>
      </div>

      <div class="grid-ssvip" id="ssvipContainer">
        <div class="astra-card" style="text-align: center; padding: 30px;">Loading SSVIP tiers...</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatCurrency } from './shared/formatters.js';

    async function loadSSVIP() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;

      const { data: category } = await supabase
        .from('product_categories')
        .select('id')
        .eq('slug', 'ssvip')
        .single();

      if (!category) return;

      const { data: products } = await supabase
        .from('products')
        .select('*')
        .eq('category_id', category.id)
        .order('price', { ascending: true });

      const container = document.getElementById('ssvipContainer');

      if (!products || products.length === 0) {
        container.innerHTML = `<div class="astra-card" style="grid-column: 1 / -1; text-align: center; padding: 30px;">No SSVIP packages active.</div>`;
        return;
      }

      container.innerHTML = products.map(prod => `
        <div class="astra-card-signature" style="margin-bottom: 0;">
          <div class="card-signature-content">
            <div class="signature-top-row">
              <span class="signature-brand-tag">${prod.code}</span>
              <span class="badge-status ${prod.is_active ? 'badge-completed' : 'badge-pending'}">${prod.is_active ? 'Open' : 'Coming Soon'}</span>
            </div>

            <h2 style="font-size: 1.4rem; color: var(--white); margin-bottom: 6px;">${prod.name}</h2>
            <div style="font-size: 1.7rem; font-family: var(--font-heading); color: var(--bright-gold); margin-bottom: 14px;">
              ${formatCurrency(prod.price)}
            </div>

            <div style="background: rgba(0,0,0,0.3); padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.85rem;">
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: var(--secondary-text);">Maturity Term:</span>
                <strong>${prod.duration_days} Days</strong>
              </div>
              <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: var(--secondary-text);">Total Payout at Maturity:</span>
                <strong style="color: var(--bright-gold);">${formatCurrency(prod.total_payout)}</strong>
              </div>
              <div style="display: flex; justify-content: space-between;">
                <span style="color: var(--secondary-text);">Net Growth:</span>
                <strong style="color: var(--success-green);">+${formatCurrency(prod.total_payout - prod.price)}</strong>
              </div>
            </div>

            <div>
              ${prod.is_active ? `
                <a href="invest.html?product_id=${prod.id}" class="btn-gold" style="width: 100%;">Invest Now</a>
              ` : `
                <button class="btn-emerald" disabled style="width: 100%; opacity: 0.5;">Coming Soon</button>
              `}
            </div>
          </div>
        </div>
      `).join('');
    }

    loadSSVIP();
  </script>
</body>
</html>
