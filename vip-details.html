<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Package Details | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .details-box {
      max-width: 680px;
      margin: 0 auto;
    }
    .details-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 20px 0;
    }
    .spec-item {
      background: var(--light-gold-bg);
      border: 1px solid rgba(212, 175, 55, 0.4);
      padding: 14px;
      border-radius: var(--radius-sm);
    }
    .spec-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--secondary-text);
    }
    .spec-val {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--deep-forest);
      font-family: var(--font-heading);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="details-box">
        <a href="vip.html" style="color: var(--primary-green); text-decoration: none; font-weight: 600; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 16px;">
          ← Back to ASTRA-VIP Catalog
        </a>

        <div class="astra-card" id="detailsContainer">
          <p style="color: var(--secondary-text); text-align: center; padding: 40px;">Loading product details...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatCurrency } from './shared/formatters.js';

    async function loadDetails() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;

      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      const container = document.getElementById('detailsContainer');

      if (!productId) {
        container.innerHTML = `<p style="color: var(--error-red); text-align: center;">No product identifier provided.</p>`;
        return;
      }

      const { data: prod, error } = await supabase
        .from('products')
        .select('*')
        .eq('id', productId)
        .maybeSingle();

      if (error || !prod) {
        container.innerHTML = `
          <div style="text-align: center; padding: 30px;">
            <h2 style="color: var(--error-red); margin-bottom: 8px;">Package Not Found</h2>
            <p style="color: var(--secondary-text); margin-bottom: 16px;">The requested package does not exist or has been archived.</p>
            <a href="vip.html" class="btn-emerald">Browse VIP Packages</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="details-top">
          <span class="badge-status ${prod.is_active ? 'badge-completed' : 'badge-pending'}">
            ${prod.is_active ? 'Available for Investment' : 'Coming Soon'}
          </span>
          <span style="font-weight: 700; color: var(--metallic-gold); font-size: 0.85rem;">${prod.code}</span>
        </div>

        <h1 style="font-size: 1.8rem; color: var(--deep-forest); margin-bottom: 8px;">${prod.name}</h1>
        <p style="color: var(--secondary-text); font-size: 0.95rem; line-height: 1.5;">${prod.description || 'Verified commercial aircraft investment tier.'}</p>

        <div class="specs-grid">
          <div class="spec-item">
            <div class="spec-label">Package Cost</div>
            <div class="spec-val" style="color: var(--primary-green);">${formatCurrency(prod.price)}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Cycle Duration</div>
            <div class="spec-val">${prod.duration_days} Calendar Days</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Daily Settlement</div>
            <div class="spec-val">${formatCurrency(prod.daily_income)}</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Total Contract Payout</div>
            <div class="spec-val" style="color: #003D24;">${formatCurrency(prod.total_payout)}</div>
          </div>
        </div>

        <div style="margin-top: 24px;">
          ${prod.is_active ? `
            <a href="invest.html?product_id=${prod.id}" class="btn-gold" style="width: 100%; font-size: 1rem; padding: 14px;">Proceed to Invest</a>
          ` : `
            <button class="btn-emerald" disabled style="width: 100%; opacity: 0.6; cursor: not-allowed; padding: 14px;">Package Not Yet Available</button>
          `}
        </div>
      `;
    }

    loadDetails();
  </script>
</body>
</html>
