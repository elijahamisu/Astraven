<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at center, var(--cream-white) 0%, #F5EEDB 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--metallic-gold);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-brand {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      color: var(--deep-forest);
      letter-spacing: 2px;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }
    .auth-subtitle {
      color: var(--secondary-text);
      font-size: 0.95rem;
    }
    .form-group {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--deep-forest);
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: var(--font-body);
      color: var(--primary-text);
      background: var(--cream-white);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary-green);
      box-shadow: 0 0 0 3px rgba(0, 107, 60, 0.15);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--secondary-text);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .form-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      font-size: 0.85rem;
    }
    .form-meta a {
      color: var(--primary-green);
      text-decoration: none;
      font-weight: 500;
    }
    .form-meta a:hover { text-decoration: underline; }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error {
      background: #FDE8E8;
      border: 1px solid var(--error-red);
      color: var(--error-red);
      display: block;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--secondary-text);
    }
    .auth-footer a {
      color: var(--primary-green);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">ASTRAVEN</a>
        <p class="auth-subtitle">Sign in to manage your portfolio</p>
      </div>

      <div id="alertBanner" class="alert-banner"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" class="form-control" placeholder="name@example.com or username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Your password" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" id="togglePwd">Show</button>
          </div>
        </div>

        <div class="form-meta">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember this device</span>
          </label>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" id="submitBtn" class="btn-gold" style="width: 100%;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register Now</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabase-client.js';

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');
    const togglePwd = document.getElementById('togglePwd');
    const passwordInput = document.getElementById('password');

    // Check if session already exists
    if (supabase) {
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) {
          window.location.href = 'dashboard.html';
        }
      });
    }

    togglePwd.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        togglePwd.textContent = 'Hide';
      } else {
        passwordInput.type = 'password';
        togglePwd.textContent = 'Show';
      }
    });

    function showError(msg) {
      alertBanner.textContent = msg;
      alertBanner.className = 'alert-banner error';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = passwordInput.value;

      if (!identifier || !password) {
        return showError('Please enter both your identifier and password.');
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        let authEmail = identifier;

        // If username was provided, resolve email via secure RPC
        if (!identifier.includes('@')) {
          const { data: resolvedEmail, error: rpcErr } = await supabase.rpc('get_login_identifier', {
            p_identifier: identifier
          });
          if (rpcErr || !resolvedEmail) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
            return showError('Invalid username or credentials.');
          }
          authEmail = resolvedEmail;
        }

        const { data, error } = await supabase.auth.signInWithPassword({
          email: authEmail,
          password: password
        });

        if (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          return showError(error.message.includes('Invalid login') 
            ? 'Invalid email/username or password.' 
            : error.message);
        }

        // Determine destination redirect
        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');
        window.location.href = redirect ? decodeURIComponent(redirect) : 'dashboard.html';
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        showError('Sign-in failed. Please check your network and try again.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
