<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at center, var(--cream-white) 0%, #F5EEDB 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--metallic-gold);
      box-shadow: var(--shadow-lg);
      padding: 36px 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
    .toggle-pwd {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--secondary-text);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="index.html" class="brand-wordmark" style="font-size: 2rem; text-decoration: none; display: inline-block;">ASTRAVEN</a>
        <p style="color: var(--secondary-text); font-size: 0.9rem; margin-top: 4px;">Sign in to your investor portal</p>
      </div>

      <div id="alertBanner" class="alert-banner"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="identifier">Email or Username</label>
          <input type="text" id="identifier" class="form-control" placeholder="name@example.com or username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-control" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" id="togglePwd">Show</button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember session</span>
          </label>
          <a href="forgot-password.html" style="color: var(--primary-green); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>

        <button type="submit" id="submitBtn" class="btn-gold" style="width: 100%; padding: 13px; font-size: 1rem;">
          Sign In
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--secondary-text);">
        Do not have an account? <a href="register.html" style="color: var(--primary-green); font-weight: 700; text-decoration: none;">Register Now</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabase-client.js';

    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');
    const togglePwd = document.getElementById('togglePwd');
    const pwdInput = document.getElementById('password');

    // Check if already authenticated
    if (supabase) {
      supabase.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'dashboard.html';
      });
    }

    togglePwd.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      togglePwd.textContent = isPwd ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const identifier = document.getElementById('identifier').value.trim();
      const password = pwdInput.value;

      if (!identifier || !password) {
        alertBanner.textContent = 'Please enter both credentials.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        let authEmail = identifier;

        if (!identifier.includes('@')) {
          const { data: resolvedEmail, error: rpcErr } = await supabase.rpc('get_login_identifier', {
            p_identifier: identifier
          });
          if (rpcErr || !resolvedEmail) {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In';
            alertBanner.textContent = 'Invalid credentials or account suspended.';
            alertBanner.className = 'alert-banner error';
            return;
          }
          authEmail = resolvedEmail;
        }

        const { data, error } = await supabase.auth.signInWithPassword({
          email: authEmail,
          password: password
        });

        if (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          alertBanner.textContent = 'Invalid login credentials.';
          alertBanner.className = 'alert-banner error';
          return;
        }

        // Verify profile suspension status
        const { data: profile } = await supabase
          .from('profiles')
          .select('is_suspended')
          .eq('id', data.user.id)
          .single();

        if (profile?.is_suspended) {
          await supabase.auth.signOut();
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
          alertBanner.textContent = 'This account has been suspended. Please contact customer support.';
          alertBanner.className = 'alert-banner error';
          return;
        }

        window.location.href = 'dashboard.html';

      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
        alertBanner.textContent = 'Authentication service timeout. Please try again.';
        alertBanner.className = 'alert-banner error';
      }
    });
  </script>
</body>
</html>
