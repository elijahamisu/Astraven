<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Deposits | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .page-header-wrap {
      margin-bottom: 20px;
    }
    .header-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--metallic-gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-block;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--deep-forest);
      line-height: 1.2;
    }
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar {
      display: none;
    }
    .filter-btn {
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      background: var(--white);
      color: var(--deep-forest);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: var(--deep-forest);
      color: var(--bright-gold);
      border-color: var(--metallic-gold);
      box-shadow: 0 2px 8px rgba(0, 43, 26, 0.2);
    }
    .deposits-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .deposit-card {
      background: var(--white);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(0, 43, 26, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .card-top-bar {
      background: #FAFAFA;
      padding: 12px 16px;
      border-bottom: 1px solid #ECECEC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .ref-code {
      font-family: monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--deep-forest);
    }
    .ref-date {
      font-size: 0.75rem;
      color: var(--secondary-text);
      display: block;
      margin-top: 2px;
    }
    .card-body {
      padding: 16px;
    }
    .amount-investor-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .amount-value {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary-green);
      line-height: 1.1;
    }
    .amount-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary-text);
      display: block;
      margin-bottom: 2px;
    }
    .investor-meta {
      text-align: right;
    }
    .investor-handle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--deep-forest);
      display: block;
    }
    .investor-name {
      font-size: 0.8rem;
      color: var(--secondary-text);
    }
    .narration-box {
      background: var(--cream-white);
      border: 1px solid #E5E7EB;
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }
    .narration-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--metallic-gold);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: block;
    }
    .narration-text {
      color: var(--primary-text);
      word-break: break-all;
      font-family: monospace;
      font-size: 0.82rem;
    }
    .proof-btn {
      width: 100%;
      background: var(--light-gold-bg);
      border: 1px dashed var(--metallic-gold);
      border-radius: var(--radius-sm);
      color: var(--primary-green);
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .card-actions-row {
      padding: 12px 16px;
      background: #FFFDF8;
      border-top: 1px solid #ECECEC;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }
    .btn-approve-action {
      background: linear-gradient(135deg, var(--bright-gold) 0%, var(--metallic-gold) 100%);
      color: var(--deep-forest);
      border: 1px solid var(--metallic-gold);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-reject-action {
      background: rgba(215, 25, 32, 0.08);
      color: var(--error-red);
      border: 1px solid var(--error-red);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .settled-note {
      font-size: 0.8rem;
      color: var(--secondary-text);
      font-style: italic;
      text-align: center;
      width: 100%;
      padding: 6px 0;
    }
    .empty-state-box {
      background: var(--white);
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
      border-radius: var(--radius-md);
      padding: 48px 20px;
      text-align: center;
      color: var(--secondary-text);
    }
    @media (min-width: 768px) {
      .deposits-feed {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="page-header-wrap">
        <span class="header-tag">✦ Custody Reconciliation</span>
        <h1 class="header-title font-heading">Manual Bank Deposits</h1>
      </div>

      <!-- Horizontal Pill Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All Deposits</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="approved">Approved</button>
        <button class="filter-btn" data-filter="rejected">Rejected</button>
      </div>

      <!-- Responsive Card Feed -->
      <div class="deposits-feed" id="depositsFeed">
        <div class="empty-state-box">
          <p>Loading deposits...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency, formatDate } from '../shared/formatters.js';

    let currentSession = null;
    let allDeposits = [];

    async function loadDeposits() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      const container = document.getElementById('depositsFeed');

      const { data: deposits, error } = await supabase
        .from('deposits')
        .select(`
          id, reference, amount, sender_name, transfer_reference, receipt_url, status, created_at,
          profiles:user_id(username, full_name)
        `)
        .order('created_at', { ascending: false })
        .limit(100);

      if (error) {
        container.innerHTML = `
          <div class="empty-state-box" style="color: var(--error-red);">
            <p><strong>Failed to load deposits:</strong> ${error.message}</p>
            <button class="btn-gold" style="margin-top: 14px; padding: 8px 18px;" onclick="window.location.reload()">Retry</button>
          </div>
        `;
        return;
      }

      if (!deposits || deposits.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box">
            <p>No deposit submissions found.</p>
          </div>
        `;
        return;
      }

      allDeposits = deposits;
      renderCards('all');

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards(btn.dataset.filter);
        });
      });
    }

    function renderCards(filter) {
      const container = document.getElementById('depositsFeed');
      const filtered = allDeposits.filter(d => filter === 'all' || d.status === filter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box" style="grid-column: 1 / -1;">
            <p>No deposits match this filter.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(d => {
        const isPending = d.status === 'pending';
        const badgeClass = d.status === 'approved' ? 'badge-completed' : (isPending ? 'badge-pending' : 'badge-failed');
        const username = d.profiles?.username || 'user';
        const fullName = d.profiles?.full_name || d.sender_name || 'Investor';

        return `
          <div class="deposit-card" id="card-${d.id}">
            <!-- Top Bar -->
            <div class="card-top-bar">
              <div>
                <span class="ref-code">${d.reference}</span>
                <span class="ref-date">${formatDate(d.created_at)}</span>
              </div>
              <span class="badge-status ${badgeClass}">
                ${d.status.toUpperCase()}
              </span>
            </div>

            <!-- Body -->
            <div class="card-body">
              <div class="amount-investor-row">
                <div>
                  <span class="amount-label">Deposit Amount</span>
                  <div class="amount-value">${formatCurrency(d.amount)}</div>
                </div>
                <div class="investor-meta">
                  <span class="amount-label">Investor</span>
                  <span class="investor-handle">@${username}</span>
                  <span class="investor-name">${fullName}</span>
                </div>
              </div>

              <!-- Narration Details -->
              <div class="narration-box">
                <span class="narration-label">Bank Narration / Reference</span>
                <div class="narration-text">${escapeHtml(d.transfer_reference || 'None provided')}</div>
              </div>

              <!-- Receipt Proof -->
              ${d.receipt_url ? `
                <button class="proof-btn" onclick="viewReceipt('${d.receipt_url}')">
                  <span>📎</span>
                  <span>View Payment Receipt Screenshot</span>
                </button>
              ` : ''}
            </div>

            <!-- Action Buttons -->
            <div class="card-actions-row">
              ${isPending ? `
                <button class="btn-approve-action" onclick="reviewDep('${d.id}', 'approved')">
                  <span>✓</span>
                  <span>Approve &amp; Credit</span>
                </button>
                <button class="btn-reject-action" onclick="reviewDep('${d.id}', 'rejected')">
                  <span>✕</span>
                  <span>Reject</span>
                </button>
              ` : `
                <div class="settled-note" style="grid-column: span 2;">
                  This request has been settled (${d.status}).
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    window.viewReceipt = async function(receiptPath) {
      if (!receiptPath) return;

      try {
        const { data, error } = await supabase.storage
          .from('deposit-receipts')
          .createSignedUrl(receiptPath, 600);

        if (error || !data?.signedUrl) {
          alert('Could not open receipt proof: ' + (error?.message || 'File not found.'));
          return;
        }

        window.open(data.signedUrl, '_blank');
      } catch (err) {
        alert('Receipt access error.');
      }
    };

    // Review Deposit Action: Fast direct RPC with full fallback and error display
    window.reviewDep = async function(id, decision) {
      let reason = null;
      if (decision === 'rejected') {
        reason = prompt('Enter administrative rejection reason:');
        if (!reason) return;
      }

      const card = document.getElementById(`card-${id}`);
      const actionsRow = card?.querySelector('.card-actions-row');
      if (actionsRow) {
        actionsRow.innerHTML = `<div class="settled-note" style="grid-column: span 2;">Processing ${decision}...</div>`;
      }

      try {
        // 1. Direct RPC execution (Fastest, zero serverless timeout)
        const { data, error } = await supabase.rpc('review_deposit_request', {
          p_deposit_id: id,
          p_admin_id: currentSession.user.id,
          p_decision: decision,
          p_rejection_reason: reason
        });

        if (error || !data?.success) {
          // 2. Fallback to serverless API endpoint if RPC fails
          const res = await fetch('/api/deposits/review', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${currentSession.access_token}`
            },
            body: JSON.stringify({ depositId: id, decision, rejectionReason: reason })
          });

          const apiData = await res.json();
          if (!apiData.success) {
            alert('Deposit review error: ' + (apiData.error || error?.message || 'Action failed'));
          } else {
            alert(`Deposit ${decision} successfully!`);
          }
        } else {
          alert(`Deposit ${decision} successfully! User wallet credited.`);
        }

        loadDeposits();

      } catch (err) {
        console.error('Fatal review error:', err);
        alert('Action error: ' + err.message);
        loadDeposits();
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadDeposits();
  </script>
</body>
</html>
