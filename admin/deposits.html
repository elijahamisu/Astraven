<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Deposits | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Custody Reconciliation</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Manual Bank Deposits</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="depositTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading deposits...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency, formatDate } from '../shared/formatters.js';

    let currentSession = null;

    async function loadDeposits() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      const { data: deposits, error } = await supabase
        .from('deposits')
        .select(`*, profiles(username, full_name, email)`)
        .order('created_at', { ascending: false })
        .limit(100);

      const container = document.getElementById('depositTableContainer');
      if (error || !deposits || deposits.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No deposit submissions found.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Ref / Date</th>
              <th style="padding: 12px;">User</th>
              <th style="padding: 12px;">Amount</th>
              <th style="padding: 12px;">Narration</th>
              <th style="padding: 12px;">Status</th>
              <th style="padding: 12px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${deposits.map(d => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px;">
                  <strong style="font-family: monospace;">${d.reference}</strong>
                  <div style="font-size: 0.72rem; color: var(--secondary-text);">${formatDate(d.created_at)}</div>
                </td>
                <td style="padding: 12px;">
                  <div>@${d.profiles?.username || 'user'}</div>
                  <small style="color: var(--secondary-text);">${d.sender_name || '—'}</small>
                </td>
                <td style="padding: 12px; font-weight: 700; color: var(--primary-green);">${formatCurrency(d.amount)}</td>
                <td style="padding: 12px; font-size: 0.8rem;">${d.transfer_reference || '—'}</td>
                <td style="padding: 12px;">
                  <span class="badge-status ${d.status === 'approved' ? 'badge-completed' : (d.status === 'pending' ? 'badge-pending' : 'badge-failed')}">
                    ${d.status}
                  </span>
                </td>
                <td style="padding: 12px;">
                  ${d.status === 'pending' ? `
                    <button class="btn-gold" style="padding: 6px 12px; font-size: 0.75rem; margin-right: 6px;" onclick="reviewDep('${d.id}', 'approved')">Approve</button>
                    <button class="btn-emerald" style="padding: 6px 12px; font-size: 0.75rem;" onclick="reviewDep('${d.id}', 'rejected')">Reject</button>
                  ` : `
                    <span style="font-size: 0.75rem; color: var(--secondary-text);">Settled</span>
                  `}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    window.reviewDep = async function(id, decision) {
      let reason = null;
      if (decision === 'rejected') {
        reason = prompt('Enter rejection reason:');
        if (!reason) return;
      }

      const res = await fetch('/api/deposits/review', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`
        },
        body: JSON.stringify({ depositId: id, decision, rejectionReason: reason })
      });

      const data = await res.json();
      if (!data.success) alert(data.error || 'Failed');
      else {
        alert(`Deposit ${decision} successfully.`);
        loadDeposits();
      }
    };

    loadDeposits();
  </script>
</body>
</html>
