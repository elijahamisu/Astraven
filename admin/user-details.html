<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dossier | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .dossier-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 16px;">
        <a href="users.html" style="color: var(--primary-green); font-size: 0.85rem; font-weight: 600; text-decoration: none;">← Back to Users List</a>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest); margin-top: 6px;" id="userHeading">Investor Dossier</h1>
      </div>

      <div class="dossier-grid" id="dossierCards">
        <p style="color: var(--secondary-text);">Loading user details...</p>
      </div>

      <div class="astra-card" style="margin-bottom: 24px;">
        <h2 style="font-size: 1.2rem; color: var(--deep-forest); margin-bottom: 14px;">Administrative Actions</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button id="toggleSuspendBtn" class="btn-emerald">Loading...</button>
          <a id="adjustWalletBtn" class="btn-gold" style="text-decoration: none;">Adjust Wallet Balance</a>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency, formatDate } from '../shared/formatters.js';

    let currentAdmin = null;
    let targetUserId = null;
    let isCurrentlySuspended = false;

    async function loadDossier() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentAdmin = auth.session.user;

      const urlParams = new URLSearchParams(window.location.search);
      targetUserId = urlParams.get('id');
      if (!targetUserId) return;

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', targetUserId).single();
      const { data: wallet } = await supabase.from('wallets').select('*').eq('user_id', targetUserId).single();

      if (!profile) return;
      isCurrentlySuspended = profile.is_suspended;

      document.getElementById('userHeading').textContent = `Dossier: @${profile.username}`;
      document.getElementById('adjustWalletBtn').href = `wallet-adjustments.html?user_id=${profile.id}`;

      const suspendBtn = document.getElementById('toggleSuspendBtn');
      suspendBtn.textContent = isCurrentlySuspended ? 'Reactivate Account' : 'Suspend Account';
      suspendBtn.onclick = handleToggleSuspend;

      document.getElementById('dossierCards').innerHTML = `
        <div class="astra-card">
          <h3 style="font-size: 1.1rem; color: var(--deep-forest); margin-bottom: 10px;">Identity</h3>
          <p><strong>Full Name:</strong> ${profile.full_name || '—'}</p>
          <p><strong>Username:</strong> @${profile.username}</p>
          <p><strong>Phone:</strong> ${profile.phone || '—'}</p>
          <p><strong>Referral Code:</strong> ${profile.referral_code}</p>
          <p><strong>Status:</strong> ${profile.is_suspended ? 'Suspended' : 'Active'}</p>
          <p><strong>Registered:</strong> ${formatDate(profile.created_at)}</p>
        </div>
        <div class="astra-card">
          <h3 style="font-size: 1.1rem; color: var(--deep-forest); margin-bottom: 10px;">Wallet Balances</h3>
          <p><strong>Available:</strong> ${formatCurrency(wallet?.balance || 0)}</p>
          <p><strong>Reserved (Pending):</strong> ${formatCurrency(wallet?.reserved_balance || 0)}</p>
          <p><strong>Total Deposited:</strong> ${formatCurrency(wallet?.total_deposited || 0)}</p>
          <p><strong>Total Withdrawn:</strong> ${formatCurrency(wallet?.total_withdrawn || 0)}</p>
          <p><strong>Total Earned:</strong> ${formatCurrency(wallet?.total_earned || 0)}</p>
        </div>
      `;
    }

    async function handleToggleSuspend() {
      const reason = prompt('Enter administrative reason for status change:');
      if (!reason) return;

      const { data, error } = await supabase.rpc('admin_toggle_user_suspension', {
        p_target_user_id: targetUserId,
        p_admin_id: currentAdmin.id,
        p_suspend: !isCurrentlySuspended,
        p_reason: reason
      });

      if (error || !data.success) alert(data?.error || error?.message || 'Failed');
      else {
        alert('User status updated successfully.');
        window.location.reload();
      }
    }

    loadDossier();
  </script>
</body>
</html>
