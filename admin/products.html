<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px;">
        <div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Aviation Syndicates</span>
          <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Product Catalog</h1>
        </div>
        <a href="product-create.html" class="btn-gold" style="padding: 10px 18px; font-size: 0.85rem;">+ Create New Package</a>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="productsTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading flight packages...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency } from '../shared/formatters.js';

    let currentSession = null;

    async function loadProducts() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      const { data: prods, error } = await supabase
        .from('products')
        .select(`*, product_categories(name, slug)`)
        .order('price', { ascending: true });

      const container = document.getElementById('productsTableContainer');
      if (error || !prods || prods.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No packages configured.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 650px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Code / Name</th>
              <th style="padding: 12px;">Category</th>
              <th style="padding: 12px;">Cost</th>
              <th style="padding: 12px;">Cycle</th>
              <th style="padding: 12px;">Daily Settlement</th>
              <th style="padding: 12px;">Total Payout</th>
              <th style="padding: 12px;">Status</th>
              <th style="padding: 12px;">Action</th>
            </tr>
          </thead>
          <tbody>
            ${prods.map(p => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px;">
                  <strong style="color: var(--deep-forest); font-family: monospace;">${p.code}</strong>
                  <div style="font-size: 0.75rem; color: var(--secondary-text);">${p.name}</div>
                </td>
                <td style="padding: 12px; font-weight: 600;">${p.product_categories?.name || 'VIP'}</td>
                <td style="padding: 12px; font-weight: 700; color: var(--primary-green);">${formatCurrency(p.price)}</td>
                <td style="padding: 12px;">${p.duration_days} Days</td>
                <td style="padding: 12px; color: var(--metallic-gold); font-weight: 700;">${p.daily_income > 0 ? formatCurrency(p.daily_income) : '—'}</td>
                <td style="padding: 12px; font-weight: 700;">${formatCurrency(p.total_payout)}</td>
                <td style="padding: 12px;">
                  <span class="badge-status ${p.is_active ? 'badge-completed' : 'badge-pending'}">
                    ${p.is_active ? 'Active' : 'Closed'}
                  </span>
                </td>
                <td style="padding: 12px;">
                  <button class="${p.is_active ? 'btn-emerald' : 'btn-gold'}" style="padding: 6px 12px; font-size: 0.75rem;" onclick="toggleStatus('${p.id}', ${!p.is_active})">
                    ${p.is_active ? 'Deactivate' : 'Activate'}
                  </button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    window.toggleStatus = async function(id, newState) {
      const { data, error } = await supabase.rpc('admin_toggle_product_status', {
        p_admin_id: currentSession.user.id,
        p_product_id: id,
        p_is_active: newState
      });
      if (error || !data.success) alert('Failed to update product state');
      else loadProducts();
    };

    loadProducts();
  </script>
</body>
</html>
