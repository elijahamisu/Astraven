<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Proof Moderation | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .page-header-wrap { margin-bottom: 20px; }
    .header-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--metallic-gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-block;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--deep-forest);
      line-height: 1.2;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      background: var(--white);
      color: var(--deep-forest);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: var(--deep-forest);
      color: var(--bright-gold);
      border-color: var(--metallic-gold);
      box-shadow: 0 2px 8px rgba(0, 43, 26, 0.2);
    }

    /* Mobile Cards Feed */
    .posts-mod-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mod-card {
      background: var(--white);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(0, 43, 26, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .mod-card:hover {
      border-color: var(--metallic-gold);
      box-shadow: 0 6px 18px rgba(0, 43, 26, 0.12);
    }

    .card-top-bar {
      background: #FAFAFA;
      padding: 12px 16px;
      border-bottom: 1px solid #ECECEC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .author-handle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--deep-forest);
    }
    .post-date {
      font-size: 0.75rem;
      color: var(--secondary-text);
      display: block;
      margin-top: 2px;
    }

    .card-body {
      padding: 16px;
    }
    .post-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--deep-forest);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .post-content {
      font-size: 0.9rem;
      color: var(--primary-text);
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Inline Proof Image */
    .proof-image-container {
      margin: 12px 0;
      border: 1px solid #E5E7EB;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #000;
    }
    .proof-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      cursor: pointer;
      display: block;
    }
    .proof-caption {
      font-size: 0.72rem;
      color: var(--secondary-text);
      padding: 6px 10px;
      background: #FAFAFA;
      text-align: center;
      display: block;
      border-top: 1px solid #E5E7EB;
    }

    /* Action Buttons Row */
    .card-actions-row {
      padding: 12px 16px;
      background: #FFFDF8;
      border-top: 1px solid #ECECEC;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-approve-mod {
      flex: 2;
      min-width: 130px;
      background: linear-gradient(135deg, var(--bright-gold) 0%, var(--metallic-gold) 100%);
      color: var(--deep-forest);
      border: 1px solid var(--metallic-gold);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-reject-mod {
      flex: 1;
      min-width: 90px;
      background: rgba(0, 43, 26, 0.08);
      color: var(--deep-forest);
      border: 1px solid rgba(0, 43, 26, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-delete-mod {
      flex: 1;
      min-width: 90px;
      background: rgba(215, 25, 32, 0.08);
      color: var(--error-red);
      border: 1px solid var(--error-red);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-delete-mod:hover {
      background: var(--error-red);
      color: var(--white);
    }

    .empty-state-box {
      background: var(--white);
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
      border-radius: var(--radius-md);
      padding: 48px 20px;
      text-align: center;
      color: var(--secondary-text);
    }

    @media (min-width: 768px) {
      .posts-mod-feed {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="page-header-wrap">
        <span class="header-tag">✦ Content Governance</span>
        <h1 class="header-title font-heading">Community Proof Moderation</h1>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All Posts</button>
        <button class="filter-btn" data-filter="pending">Pending Review</button>
        <button class="filter-btn" data-filter="approved">Approved &amp; Live</button>
        <button class="filter-btn" data-filter="rejected">Rejected</button>
      </div>

      <!-- Mobile-first Cards Feed -->
      <div class="posts-mod-feed" id="postsModFeed">
        <div class="empty-state-box">
          <p>Loading community submissions...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatDate } from '../shared/formatters.js';

    let currentSession = null;
    let allPosts = [];

    async function loadPosts() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      const container = document.getElementById('postsModFeed');

      const { data: posts, error } = await supabase
        .from('blog_posts')
        .select(`*, profiles:user_id(username, full_name)`)
        .order('created_at', { ascending: false })
        .limit(60);

      if (error || !posts || posts.length === 0) {
        container.innerHTML = `<div class="empty-state-box" style="grid-column: 1 / -1;"><p>No community submissions found.</p></div>`;
        return;
      }

      allPosts = posts;
      renderCards('all');

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderCards(btn.dataset.filter);
        });
      });
    }

    function renderCards(filter) {
      const container = document.getElementById('postsModFeed');
      const filtered = allPosts.filter(p => filter === 'all' || p.status === filter);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state-box" style="grid-column: 1 / -1;"><p>No posts match this filter.</p></div>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const isPending = p.status === 'pending';
        const isApproved = p.status === 'approved';
        const badgeClass = isApproved ? 'badge-completed' : (isPending ? 'badge-pending' : 'badge-failed');
        const username = p.profiles?.username || 'user';

        return `
          <div class="mod-card" id="card-${p.id}">
            <!-- Top Bar -->
            <div class="card-top-bar">
              <div>
                <span class="author-handle">@${username}</span>
                <span class="post-date">${formatDate(p.created_at)}</span>
              </div>
              <span class="badge-status ${badgeClass}">
                ${p.status.toUpperCase()}
              </span>
            </div>

            <!-- Body -->
            <div class="card-body">
              <h2 class="post-title">${escapeHtml(p.title)}</h2>
              <p class="post-content">${escapeHtml(p.content)}</p>

              <!-- Inline Screenshot Preview -->
              ${p.image_url ? `
                <div class="proof-image-container">
                  <img src="${p.image_url}" alt="Payment Proof" class="proof-img" onclick="window.open('${p.image_url}', '_blank')">
                  <span class="proof-caption">🔍 Tap screenshot to view full resolution</span>
                </div>
              ` : ''}

              ${p.caption ? `
                <p style="font-size: 0.8rem; color: var(--secondary-text); font-style: italic;">"${escapeHtml(p.caption)}"</p>
              ` : ''}

              ${p.bonus_awarded ? `
                <div style="background: var(--light-gold-bg); border: 1px solid var(--metallic-gold); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.78rem; font-weight: 700; color: var(--primary-green); margin-top: 8px;">
                  ✦ Platform Bonus Awarded: ₦${Number(p.bonus_amount).toLocaleString()}
                </div>
              ` : ''}

              ${p.rejection_reason ? `
                <div style="background: #FDE8E8; border: 1px solid var(--error-red); padding: 8px 12px; border-radius: var(--radius-sm); font-size: 0.78rem; color: var(--error-red); margin-top: 8px;">
                  <strong>Rejection Note:</strong> ${escapeHtml(p.rejection_reason)}
                </div>
              ` : ''}
            </div>

            <!-- Action Buttons: Approve, Reject, and Always-Available Delete -->
            <div class="card-actions-row">
              ${isPending ? `
                <button class="btn-approve-mod" onclick="moderatePost('${p.id}', 'approved')">
                  <span>✓</span>
                  <span>Approve &amp; Bonus</span>
                </button>
                <button class="btn-reject-mod" onclick="moderatePost('${p.id}', 'rejected')">
                  <span>✕</span>
                  <span>Reject</span>
                </button>
              ` : ''}

              <!-- Delete button is available on EVERY post (before or after approval) -->
              <button class="btn-delete-mod" style="${!isPending ? 'flex: 1; width: 100%;' : ''}" onclick="deletePost('${p.id}')">
                <span>🗑️</span>
                <span>Delete Post</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Direct Moderate Post (Approve with optional bonus, or Reject with reason)
    window.moderatePost = async function(id, decision) {
      let bonus = 0;
      let reason = null;

      if (decision === 'approved') {
        const b = prompt('Optional posting bonus amount to credit to investor wallet (₦, enter 0 for none):', '500');
        if (b === null) return;
        bonus = Number(b) || 0;
      } else {
        reason = prompt('Enter rejection reason:');
        if (!reason) return;
      }

      try {
        const { data, error } = await supabase.rpc('admin_moderate_post', {
          p_admin_id: currentSession.user.id,
          p_post_id: id,
          p_decision: decision,
          p_rejection_reason: reason,
          p_bonus_amount: bonus
        });

        if (error || !data?.success) {
          alert('Moderation failed: ' + (data?.error || error?.message || 'Error'));
        } else {
          alert(`Post ${decision} successfully!`);
          loadPosts();
        }
      } catch (err) {
        alert('Action error: ' + err.message);
      }
    };

    // Delete Post (Works before or after approval)
    window.deletePost = async function(id) {
      if (!confirm('Are you sure you want to permanently delete this community post? It will be removed from the public feed immediately.')) {
        return;
      }

      try {
        const { data, error } = await supabase.rpc('admin_delete_blog_post', {
          p_admin_id: currentSession.user.id,
          p_post_id: id
        });

        if (error || !data?.success) {
          alert('Deletion error: ' + (data?.error || error?.message || 'Failed'));
        } else {
          alert('Post permanently deleted!');
          loadPosts();
        }
      } catch (err) {
        alert('Error deleting post: ' + err.message);
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadPosts();
  </script>
</body>
</html>
