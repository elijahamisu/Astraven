<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Announcements | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Platform Broadcasts</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Announcements Manager</h1>
      </div>

      <form class="astra-card" id="annForm" style="margin-bottom: 24px;">
        <h2 style="font-size: 1.15rem; color: var(--deep-forest); margin-bottom: 12px;">Publish New Broadcast</h2>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
          <input type="text" id="annTitle" class="form-control" placeholder="Announcement Title" required>
          <textarea id="annContent" class="form-control" placeholder="Broadcast message..." required style="min-height: 80px;"></textarea>
          <select id="annCategory" class="form-control">
            <option value="General">General</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Product Updates">Product Updates</option>
          </select>
        </div>
        <button type="submit" class="btn-gold" style="padding: 10px 18px; font-size: 0.85rem;">Broadcast Notice</button>
      </form>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="annListContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading notices...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatDate } from '../shared/formatters.js';

    async function loadAnnouncements() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: notices, error } = await supabase
        .from('announcements')
        .select('*')
        .order('created_at', { ascending: false });

      const container = document.getElementById('annListContainer');
      if (error || !notices || notices.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No notices published.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Category / Title</th>
              <th style="padding: 12px;">Date</th>
              <th style="padding: 12px;">Status</th>
            </tr>
          </thead>
          <tbody>
            ${notices.map(n => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px;">
                  <span style="font-size: 0.72rem; font-weight: 700; color: var(--metallic-gold);">${n.category}</span>
                  <div style="font-weight: 700; color: var(--deep-forest);">${n.title}</div>
                </td>
                <td style="padding: 12px; color: var(--secondary-text); font-size: 0.75rem;">${formatDate(n.created_at)}</td>
                <td style="padding: 12px;"><span class="badge-status badge-completed">Published</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    document.getElementById('annForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('annTitle').value.trim();
      const content = document.getElementById('annContent').value.trim();
      const category = document.getElementById('annCategory').value;

      const { error } = await supabase.from('announcements').insert({
        title, content, category, is_active: true, priority: 1
      });

      if (error) alert(error.message);
      else {
        alert('Notice published!');
        document.getElementById('annForm').reset();
        loadAnnouncements();
      }
    });

    loadAnnouncements();
  </script>
</body>
</html>
