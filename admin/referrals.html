<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral Network Audit | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Affiliate Network Audit</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Referral Commissions</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="commsTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading commission records...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency, formatDate } from '../shared/formatters.js';

    async function loadComms() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: comms, error } = await supabase
        .from('referral_commissions')
        .select(`*, ref:profiles!referral_commissions_referrer_id_fkey(username), down:profiles!referral_commissions_referred_id_fkey(username)`)
        .order('created_at', { ascending: false })
        .limit(100);

      const container = document.getElementById('commsTableContainer');
      if (error || !comms || comms.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No commissions distributed yet.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Referrer</th>
              <th style="padding: 12px;">Downline</th>
              <th style="padding: 12px;">Deposit Amount</th>
              <th style="padding: 12px;">Commission (10%)</th>
              <th style="padding: 12px;">Settled Date</th>
            </tr>
          </thead>
          <tbody>
            ${comms.map(c => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px; font-weight: 700; color: var(--deep-forest);">@${c.ref?.username || 'user'}</td>
                <td style="padding: 12px;">@${c.down?.username || 'user'}</td>
                <td style="padding: 12px;">${formatCurrency(c.deposit_amount)}</td>
                <td style="padding: 12px; font-weight: 700; color: var(--primary-green);">${formatCurrency(c.commission_amount)}</td>
                <td style="padding: 12px; color: var(--secondary-text); font-size: 0.8rem;">${formatDate(c.created_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadComms();
  </script>
</body>
</html>
