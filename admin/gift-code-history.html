<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voucher Redemptions | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Promotional Audit</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Gift Code Redemption Ledger</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="redemptionsTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading redemptions...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency, formatDate } from '../shared/formatters.js';

    async function loadRedemptions() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: claims, error } = await supabase
        .from('gift_code_redemptions')
        .select(`*, gift_codes(code), profiles(username)`)
        .order('created_at', { ascending: false })
        .limit(100);

      const container = document.getElementById('redemptionsTableContainer');
      if (error || !claims || claims.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No voucher claims recorded.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Voucher Code</th>
              <th style="padding: 12px;">User</th>
              <th style="padding: 12px;">Amount Credited</th>
              <th style="padding: 12px;">Claim Date</th>
            </tr>
          </thead>
          <tbody>
            ${claims.map(c => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px; font-weight: 700; font-family: monospace; color: var(--metallic-gold);">${c.gift_codes?.code || '—'}</td>
                <td style="padding: 12px; font-weight: 600;">@${c.profiles?.username || 'user'}</td>
                <td style="padding: 12px; font-weight: 700; color: var(--primary-green);">${formatCurrency(c.reward_amount)}</td>
                <td style="padding: 12px; color: var(--secondary-text); font-size: 0.8rem;">${formatDate(c.created_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadRedemptions();
  </script>
</body>
</html>
