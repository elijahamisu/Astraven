<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Helpdesk | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Member Inquiries</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Customer Service Helpdesk</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="ticketsContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading tickets...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatDate } from '../shared/formatters.js';

    let currentSession = null;

    async function loadTickets() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      const { data: tickets, error } = await supabase
        .from('support_tickets')
        .select(`*, profiles(username)`)
        .order('last_message_at', { ascending: false })
        .limit(50);

      const container = document.getElementById('ticketsContainer');
      if (error || !tickets || tickets.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No support tickets open.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 650px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Ref / Category</th>
              <th style="padding: 12px;">User</th>
              <th style="padding: 12px;">Subject</th>
              <th style="padding: 12px;">Last Message</th>
              <th style="padding: 12px;">Status</th>
              <th style="padding: 12px;">Actions</th>
            </tr>
          </thead>
          <tbody>
            ${tickets.map(t => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px;">
                  <strong style="font-family: monospace;">${t.ticket_ref}</strong>
                  <div style="font-size: 0.72rem; color: var(--metallic-gold); font-weight: 700;">${t.category}</div>
                </td>
                <td style="padding: 12px; font-weight: 600;">@${t.profiles?.username || 'user'}</td>
                <td style="padding: 12px;">${t.subject}</td>
                <td style="padding: 12px; color: var(--secondary-text); font-size: 0.78rem;">${formatDate(t.last_message_at)}</td>
                <td style="padding: 12px;"><span class="badge-status ${t.status === 'resolved' ? 'badge-completed' : 'badge-pending'}">${t.status}</span></td>
                <td style="padding: 12px;">
                  <button class="btn-gold" style="padding: 6px 12px; font-size: 0.75rem;" onclick="replyTicket('${t.id}')">Reply</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    window.replyTicket = async function(id) {
      const msg = prompt('Enter administrative response:');
      if (!msg) return;

      const { data, error } = await supabase.rpc('reply_support_ticket', {
        p_ticket_id: id,
        p_sender_id: currentSession.user.id,
        p_message: msg,
        p_attachment_url: null
      });

      if (error || !data.success) alert('Failed to send reply');
      else {
        alert('Response dispatched to user.');
        loadTickets();
      }
    };

    loadTickets();
  </script>
</body>
</html>
