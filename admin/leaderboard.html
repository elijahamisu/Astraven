<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard Rankings | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Performance Audit</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Top 10 Influencer Standings</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="lbTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Calculating rankings...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency } from '../shared/formatters.js';

    async function loadLeaderboard() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: list, error } = await supabase.rpc('get_leaderboard_top10');

      const container = document.getElementById('lbTableContainer');
      if (error || !list || list.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No qualifying deposits on file.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Rank</th>
              <th style="padding: 12px;">User</th>
              <th style="padding: 12px;">Verified Team Volume</th>
              <th style="padding: 12px;">Network Size</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(l => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px; font-weight: 700; font-size: 1.1rem; color: var(--metallic-gold);">#${l.rank}</td>
                <td style="padding: 12px; font-weight: 600;">@${l.username}</td>
                <td style="padding: 12px; font-weight: 700; color: var(--primary-green); font-size: 1rem;">${formatCurrency(l.qualifying_team_deposits)}</td>
                <td style="padding: 12px;">${l.total_downlines} members</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadLeaderboard();
  </script>
</body>
</html>
