<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Security Trail</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Administrative Audit Logs</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="auditTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading security trail...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatDate } from '../shared/formatters.js';

    async function loadLogs() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: logs, error } = await supabase
        .from('audit_logs')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(100);

      const container = document.getElementById('auditTableContainer');
      if (error || !logs || logs.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No logs recorded.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 600px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Action</th>
              <th style="padding: 12px;">Admin ID</th>
              <th style="padding: 12px;">Details</th>
              <th style="padding: 12px;">Date</th>
            </tr>
          </thead>
          <tbody>
            ${logs.map(l => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px; font-weight: 700; color: var(--deep-forest);">${l.action}</td>
                <td style="padding: 12px; font-family: monospace; font-size: 0.75rem;">${l.admin_id ? l.admin_id.substring(0, 8) + '...' : 'SYSTEM'}</td>
                <td style="padding: 12px; font-family: monospace; font-size: 0.75rem; color: var(--secondary-text);">${JSON.stringify(l.details)}</td>
                <td style="padding: 12px; color: var(--secondary-text); font-size: 0.75rem;">${formatDate(l.created_at)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadLogs();
  </script>
</body>
</html>
