<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Settings | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .settings-grid { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--deep-forest); }
    .form-control {
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 0.88rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; position: relative; }
    .switch-input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch-ui { flex: 0 0 auto; width: 50px; height: 28px; border-radius: 999px; background: #D1D5DB; position: relative; transition: background .2s; }
    .switch-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
    .switch-input:checked + .switch-ui { background: var(--primary-green, #0F7A4A); }
    .switch-input:checked + .switch-ui::after { transform: translateX(22px); }
    .switch-input:focus-visible + .switch-ui { outline: 2px solid var(--metallic-gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="settings-grid">
        <div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Platform Configuration</span>
          <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Central Website Settings</h1>
        </div>

        <div id="alertBanner" class="alert-banner"></div>

        <!-- Withdrawal Configuration -->
        <form class="astra-card" id="withConfigForm">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap;">
            <h2 style="font-size: 1.25rem; color: var(--deep-forest);">Withdrawals</h2>
            <span id="withStatusBadge" class="badge-status badge-completed">OPEN</span>
          </div>

          <div class="form-group">
            <label class="switch-row" for="withEnabled">
              <span>
                <strong style="display: block; color: var(--deep-forest);">Allow withdrawals</strong>
                <small style="color: var(--secondary-text);">Turn off to lock withdrawals for all users instantly.</small>
              </span>
              <input type="checkbox" id="withEnabled" class="switch-input">
              <span class="switch-ui" aria-hidden="true"></span>
            </label>
          </div>

          <div class="form-group">
            <label for="minWith">Minimum Withdrawal (₦)</label>
            <input type="number" id="minWith" class="form-control" required min="1" step="any" placeholder="e.g. 600">
          </div>

          <div class="form-group">
            <label for="feePercent">Withdrawal Fee (%)</label>
            <input type="number" id="feePercent" class="form-control" required min="0" max="100" step="any" placeholder="e.g. 10">
          </div>

          <button type="submit" id="saveWithBtn" class="btn-emerald" style="width: 100%; padding: 12px; margin-top: 8px;">
            Save Withdrawal Settings
          </button>
        </form>

        <!-- Deposit Configuration -->
        <form class="astra-card" id="depositConfigForm">
          <h2 style="font-size: 1.25rem; color: var(--deep-forest); margin-bottom: 14px;">Deposits</h2>

          <div class="form-group">
            <label for="minDep">Minimum Deposit (₦)</label>
            <input type="number" id="minDep" class="form-control" required min="1" step="any" placeholder="e.g. 6000">
          </div>

          <button type="submit" id="saveDepBtn" class="btn-gold" style="width: 100%; padding: 12px; margin-top: 8px;">
            Save Deposit Settings
          </button>
        </form>

        <!-- Referral Configuration -->
        <form class="astra-card" id="refConfigForm">
          <h2 style="font-size: 1.25rem; color: var(--deep-forest); margin-bottom: 14px;">Referral Commission</h2>

          <div class="form-group">
            <label for="commRate">Commission on referral deposits (%)</label>
            <input type="number" id="commRate" class="form-control" required min="0" max="100" step="any" placeholder="e.g. 10">
            <small style="color: var(--secondary-text); font-size: 0.78rem;">Paid to the referrer on each successful gateway deposit.</small>
          </div>

          <button type="submit" id="saveRefBtn" class="btn-gold" style="width: 100%; padding: 12px; margin-top: 8px;">
            Save Referral Settings
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';

    let currentSession = null;
    const alertBanner = document.getElementById('alertBanner');

    function notify(msg, isError = false) {
      alertBanner.textContent = msg;
      alertBanner.className = isError ? 'alert-banner error' : 'alert-banner success';
      alertBanner.style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const configs = { deposit_config: {}, withdrawal_config: {}, referral_config: {} };
    const LABELS = { deposit_config: 'Deposit', withdrawal_config: 'Withdrawal', referral_config: 'Referral' };

    function renderWithStatus(enabled) {
      const badge = document.getElementById('withStatusBadge');
      badge.textContent = enabled ? 'OPEN' : 'LOCKED';
      badge.className = 'badge-status ' + (enabled ? 'badge-completed' : 'badge-failed');
    }

    function fillForms() {
      const d = configs.deposit_config, w = configs.withdrawal_config, r = configs.referral_config;
      document.getElementById('minDep').value = d.min_deposit ?? 6000;
      document.getElementById('minWith').value = w.min_withdrawal ?? 600;
      document.getElementById('feePercent').value = w.fee_value ?? 10;
      document.getElementById('withEnabled').checked = w.is_enabled !== false;
      renderWithStatus(w.is_enabled !== false);
      document.getElementById('commRate').value = r.commission_rate ?? 10;
    }

    async function loadSettings() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      const { data } = await supabase.from('site_settings').select('key, value')
        .in('key', ['deposit_config', 'withdrawal_config', 'referral_config']);
      (data || []).forEach((row) => { configs[row.key] = row.value || {}; });
      fillForms();

      bindForm('depositConfigForm', 'saveDepBtn', 'deposit_config', () => ({
        min_deposit: Number(document.getElementById('minDep').value)
      }));

      bindForm('withConfigForm', 'saveWithBtn', 'withdrawal_config', () => ({
        is_enabled: document.getElementById('withEnabled').checked,
        min_withdrawal: Number(document.getElementById('minWith').value),
        fee_value: Number(document.getElementById('feePercent').value),
        fee_type: 'percentage'
      }));

      bindForm('refConfigForm', 'saveRefBtn', 'referral_config', () => ({
        commission_rate: Number(document.getElementById('commRate').value)
      }));

      // Lock / open applies as soon as the switch is flipped.
      document.getElementById('withEnabled').addEventListener('change', async (e) => {
        const enabled = e.target.checked;
        const ok = await saveSetting('withdrawal_config', { ...configs.withdrawal_config, is_enabled: enabled },
          enabled ? 'Withdrawals are now OPEN for users.' : 'Withdrawals are now LOCKED for users.');
        if (ok) renderWithStatus(enabled); else e.target.checked = !enabled;
      });
    }

    function bindForm(formId, btnId, key, collect) {
      document.getElementById(formId).addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById(btnId);
        const label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        // Merge so fields not shown on this form are preserved.
        await saveSetting(key, { ...configs[key], ...collect() });
        btn.disabled = false;
        btn.textContent = label;
      });
    }

    async function saveSetting(key, value, message) {
      alertBanner.style.display = 'none';
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const res = await fetch('/api/admin/update-settings', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${(session || currentSession).access_token}`
          },
          body: JSON.stringify({ key, value })
        });
        const apiData = await res.json().catch(() => ({ success: false, error: 'Unexpected server response.' }));
        if (!apiData.success) {
          notify(apiData.error || 'Failed to update settings.', true);
          return false;
        }
        configs[key] = value;
        notify(message || `${LABELS[key]} settings saved. Users see the change immediately.`);
        return true;
      } catch (err) {
        notify('Network error saving settings: ' + err.message, true);
        return false;
      }
    }

    loadSettings();
  </script>
</body>
</html>
