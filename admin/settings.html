<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Settings | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .settings-grid { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--deep-forest); }
    .form-control {
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="settings-grid">
        <div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Platform Configuration</span>
          <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Central Website Settings</h1>
        </div>

        <!-- Deposit Configuration -->
        <form class="astra-card" id="depositConfigForm">
          <h2 style="font-size: 1.25rem; color: var(--deep-forest); margin-bottom: 14px;">Bank Deposit Destination</h2>

          <div class="form-group">
            <label for="bankName">Bank Name</label>
            <input type="text" id="bankName" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="accName">Account Name</label>
            <input type="text" id="accName" class="form-control" required>
          </div>

          <div class="form-group">
            <label for="accNum">Account Number (10 Digits)</label>
            <input type="text" id="accNum" class="form-control" maxlength="10" required>
          </div>

          <div class="form-group">
            <label for="minDep">Minimum Deposit (₦)</label>
            <input type="number" id="minDep" class="form-control" required min="1000">
          </div>

          <button type="submit" class="btn-gold" style="width: 100%; padding: 12px; margin-top: 8px;">
            Save Deposit Settings
          </button>
        </form>

        <!-- Withdrawal Configuration -->
        <form class="astra-card" id="withConfigForm">
          <h2 style="font-size: 1.25rem; color: var(--deep-forest); margin-bottom: 14px;">Withdrawal Limits &amp; Fees</h2>

          <div class="form-group">
            <label for="minWith">Minimum Withdrawal (₦)</label>
            <input type="number" id="minWith" class="form-control" required min="1000">
          </div>

          <div class="form-group">
            <label for="feePercent">Withdrawal Fee Percentage (%)</label>
            <input type="number" id="feePercent" class="form-control" required min="0" max="25" step="0.5">
          </div>

          <button type="submit" class="btn-emerald" style="width: 100%; padding: 12px; margin-top: 8px;">
            Save Withdrawal Settings
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';

    let currentSession = null;

    async function loadSettings() {
      const auth = await initAdminNavigation();
      if (!auth) return;
      currentSession = auth.session;

      // 1. Load Deposit Config
      const { data: depCfg } = await supabase.from('site_settings').select('value').eq('key', 'deposit_config').single();
      if (depCfg?.value) {
        document.getElementById('bankName').value = depCfg.value.bank_name || '';
        document.getElementById('accName').value = depCfg.value.account_name || '';
        document.getElementById('accNum').value = depCfg.value.account_number || '';
        document.getElementById('minDep').value = depCfg.value.min_deposit || 5000;
      }

      // 2. Load Withdrawal Config
      const { data: withCfg } = await supabase.from('site_settings').select('value').eq('key', 'withdrawal_config').single();
      if (withCfg?.value) {
        document.getElementById('minWith').value = withCfg.value.min_withdrawal || 3000;
        document.getElementById('feePercent').value = withCfg.value.fee_value || 5;
      }

      // Handlers
      document.getElementById('depositConfigForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const value = {
          bank_name: document.getElementById('bankName').value.trim(),
          account_name: document.getElementById('accName').value.trim(),
          account_number: document.getElementById('accNum').value.trim(),
          min_deposit: Number(document.getElementById('minDep').value),
          is_enabled: true
        };
        saveSetting('deposit_config', value);
      });

      document.getElementById('withConfigForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const value = {
          min_withdrawal: Number(document.getElementById('minWith').value),
          fee_value: Number(document.getElementById('feePercent').value),
          fee_type: 'percentage',
          is_enabled: true
        };
        saveSetting('withdrawal_config', value);
      });
    }

    async function saveSetting(key, value) {
      const res = await fetch('/api/admin/update-settings', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${currentSession.access_token}`
        },
        body: JSON.stringify({ key, value })
      });
      const data = await res.json();
      if (!data.success) alert(data.error || 'Failed');
      else alert('Settings saved successfully!');
    }

    loadSettings();
  </script>
</body>
</html>
