<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Ledger Explorer | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Global Custody Ledger</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Financial Transactions</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="txsTableContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Compiling global financial ledger...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency, formatDate } from '../shared/formatters.js';

    async function loadTransactions() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: txs, error } = await supabase
        .from('transactions')
        .select(`*, profiles(username)`)
        .order('created_at', { ascending: false })
        .limit(100);

      const container = document.getElementById('txsTableContainer');
      if (error || !txs || txs.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No transactions recorded.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 650px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Reference</th>
              <th style="padding: 12px;">Investor</th>
              <th style="padding: 12px;">Type / Description</th>
              <th style="padding: 12px;">Amount</th>
              <th style="padding: 12px;">Date</th>
              <th style="padding: 12px;">Status</th>
            </tr>
          </thead>
          <tbody>
            ${txs.map(t => {
              const isPositive = Number(t.amount) >= 0;
              return `
                <tr style="border-bottom: 1px solid #ECECEC;">
                  <td style="padding: 12px; font-family: monospace; font-size: 0.75rem;">${t.reference}</td>
                  <td style="padding: 12px;">@${t.profiles?.username || 'user'}</td>
                  <td style="padding: 12px;">
                    <div style="font-weight: 600;">${t.description}</div>
                    <small style="color: var(--secondary-text); text-transform: uppercase;">${t.type}</small>
                  </td>
                  <td style="padding: 12px; font-weight: 700; color: ${isPositive ? 'var(--success-green)' : 'var(--error-red)'}; font-size: 0.95rem;">
                    ${isPositive ? '+' : ''}${formatCurrency(t.amount)}
                  </td>
                  <td style="padding: 12px; color: var(--secondary-text); font-size: 0.78rem;">${formatDate(t.created_at)}</td>
                  <td style="padding: 12px;"><span class="badge-status ${t.status === 'completed' ? 'badge-completed' : 'badge-pending'}">${t.status}</span></td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    loadTransactions();
  </script>
</body>
</html>
