<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral VIP Tiers | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Leadership Governance</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Referral VIP Tier Requirements</h1>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="vipTiersContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading VIP levels...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency } from '../shared/formatters.js';

    async function loadTiers() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: tiers, error } = await supabase
        .from('referral_vip_levels')
        .select('*')
        .order('level', { ascending: true });

      const container = document.getElementById('vipTiersContainer');
      if (error || !tiers || tiers.length === 0) {
        container.innerHTML = `<p style="text-align: center; color: var(--secondary-text); padding: 40px;">No tiers configured.</p>`;
        return;
      }

      container.innerHTML = `
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 650px;">
          <thead>
            <tr style="background: #FAFAFA; text-align: left; color: var(--secondary-text); font-size: 0.72rem; text-transform: uppercase;">
              <th style="padding: 12px;">Level</th>
              <th style="padding: 12px;">Daily Salary</th>
              <th style="padding: 12px;">Monthly Salary</th>
              <th style="padding: 12px;">Req. Downlines</th>
              <th style="padding: 12px;">Req. Team Volume</th>
              <th style="padding: 12px;">Req. Personal Dep</th>
            </tr>
          </thead>
          <tbody>
            ${tiers.map(t => `
              <tr style="border-bottom: 1px solid #ECECEC;">
                <td style="padding: 12px; font-weight: 700; color: var(--deep-forest);">${t.name}</td>
                <td style="padding: 12px; font-weight: 700; color: var(--metallic-gold);">${formatCurrency(t.daily_salary)}</td>
                <td style="padding: 12px; font-weight: 700; color: var(--primary-green);">${formatCurrency(t.monthly_salary)}</td>
                <td style="padding: 12px;">${t.required_active_downlines} Active</td>
                <td style="padding: 12px;">${formatCurrency(t.required_team_deposits)}</td>
                <td style="padding: 12px;">${formatCurrency(t.required_personal_deposit)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    loadTiers();
  </script>
</body>
</html>
