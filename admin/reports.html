<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Reports | ASTRAVEN Admin</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .m-card { background: var(--white); border: 1.5px solid rgba(212, 175, 55, 0.35); border-radius: var(--radius-sm); padding: 18px; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px;">
        <div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Balance Sheet Analytics</span>
          <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Platform Financial Reports</h1>
        </div>
        <button id="exportCsvBtn" class="btn-gold" style="padding: 10px 18px; font-size: 0.85rem;">Download Ledger CSV</button>
      </div>

      <div class="metrics-row">
        <div class="m-card">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text);">Cumulative Deposited</span>
          <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--primary-green); margin-top: 4px;" id="repTotalDep">₦0.00</div>
        </div>
        <div class="m-card">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text);">Cumulative Withdrawn</span>
          <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--error-red); margin-top: 4px;" id="repTotalWith">₦0.00</div>
        </div>
        <div class="m-card">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text);">Total Net Liquidity</span>
          <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--deep-forest); margin-top: 4px;" id="repNetLiquidity">₦0.00</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initAdminNavigation } from '../shared/admin-navigation.js';
    import { supabase } from '../shared/supabase-client.js';
    import { formatCurrency } from '../shared/formatters.js';

    async function loadReports() {
      const auth = await initAdminNavigation();
      if (!auth) return;

      const { data: wallets } = await supabase.from('wallets').select('balance, total_deposited, total_withdrawn');
      if (wallets) {
        const dep = wallets.reduce((acc, w) => acc + Number(w.total_deposited), 0);
        const withD = wallets.reduce((acc, w) => acc + Number(w.total_withdrawn), 0);
        const bal = wallets.reduce((acc, w) => acc + Number(w.balance), 0);

        document.getElementById('repTotalDep').textContent = formatCurrency(dep);
        document.getElementById('repTotalWith').textContent = formatCurrency(withD);
        document.getElementById('repNetLiquidity').textContent = formatCurrency(bal);
      }

      document.getElementById('exportCsvBtn').addEventListener('click', async () => {
        const { data: txs } = await supabase.from('transactions').select('*').limit(500);
        if (!txs || txs.length === 0) return alert('No ledger records to export');

        const headers = ['reference', 'type', 'amount', 'balance_before', 'balance_after', 'status', 'created_at'];
        const csvContent = [headers.join(',')].concat(txs.map(t => [t.reference, t.type, t.amount, t.balance_before, t.balance_after, t.status, t.created_at].join(','))).join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ASTRAVEN_ledger_${Date.now()}.csv`;
        a.click();
      });
    }

    loadReports();
  </script>
</body>
</html>
