<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Portfolio Details | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .details-wrap {
      max-width: 640px;
      margin: 0 auto;
    }
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }
    .info-cell {
      background: var(--light-gold-bg);
      padding: 12px;
      border-radius: var(--radius-sm);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="details-wrap">
        <a href="my-investments.html" style="color: var(--primary-green); font-weight: 600; font-size: 0.85rem; text-decoration: none; display: inline-block; margin-bottom: 16px;">
          ← Back to Holdings
        </a>

        <div class="astra-card" id="contentCard">
          <p style="text-align: center; color: var(--secondary-text);">Loading holding details...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatCurrency, formatDate } from './shared/formatters.js';

    async function loadInvDetails() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;

      const urlParams = new URLSearchParams(window.location.search);
      const invId = urlParams.get('id');

      const card = document.getElementById('contentCard');

      if (!invId) {
        card.innerHTML = `<p style="color: var(--error-red);">No investment identifier specified.</p>`;
        return;
      }

      // Fetch investment and ensure authenticated user ownership
      const { data: inv, error } = await supabase
        .from('investments')
        .select('*')
        .eq('id', invId)
        .eq('user_id', session.user.id)
        .maybeSingle();

      if (error || !inv) {
        card.innerHTML = `
          <div style="text-align: center; padding: 24px;">
            <h2 style="color: var(--error-red); margin-bottom: 8px;">Record Not Accessible</h2>
            <p style="color: var(--secondary-text); font-size: 0.9rem;">You do not possess permission to view this investment.</p>
          </div>
        `;
        return;
      }

      // Load related payout history
      const { data: payouts } = await supabase
        .from('investment_payouts')
        .select('*')
        .eq('investment_id', inv.id)
        .order('payout_date', { ascending: false });

      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ECECEC; padding-bottom: 12px; margin-bottom: 16px;">
          <span class="badge-status ${inv.status === 'active' ? 'badge-completed' : 'badge-pending'}">${inv.status.toUpperCase()}</span>
          <span style="font-size: 0.75rem; color: var(--secondary-text);">REF: ${inv.id.substring(0, 8)}</span>
        </div>

        <h1 style="font-size: 1.6rem; color: var(--deep-forest); margin-bottom: 4px;">${inv.product_name}</h1>
        <div style="font-size: 1.8rem; font-family: var(--font-heading); color: var(--primary-green); font-weight: 700; margin-bottom: 12px;">
          ${formatCurrency(inv.purchase_price)}
        </div>

        <div class="info-grid">
          <div class="info-cell">
            <span style="font-size: 0.72rem; color: var(--secondary-text);">CYCLE DURATION</span>
            <div style="font-weight: 700;">${inv.duration_days} Days</div>
          </div>
          <div class="info-cell">
            <span style="font-size: 0.72rem; color: var(--secondary-text);">DAILY SETTLEMENT</span>
            <div style="font-weight: 700; color: var(--bright-gold);">${formatCurrency(inv.daily_income)}</div>
          </div>
          <div class="info-cell">
            <span style="font-size: 0.72rem; color: var(--secondary-text);">TOTAL EXPECTED</span>
            <div style="font-weight: 700;">${formatCurrency(inv.total_payout)}</div>
          </div>
          <div class="info-cell">
            <span style="font-size: 0.72rem; color: var(--secondary-text);">TOTAL CREDITED</span>
            <div style="font-weight: 700; color: var(--success-green);">${formatCurrency(inv.total_paid_out)}</div>
          </div>
          <div class="info-cell">
            <span style="font-size: 0.72rem; color: var(--secondary-text);">PURCHASE DATE</span>
            <div style="font-size: 0.85rem; font-weight: 600;">${formatDate(inv.created_at)}</div>
          </div>
          <div class="info-cell">
            <span style="font-size: 0.72rem; color: var(--secondary-text);">MATURITY DATE</span>
            <div style="font-size: 0.85rem; font-weight: 600;">${formatDate(inv.maturity_date)}</div>
          </div>
        </div>

        <h3 style="font-size: 1.1rem; color: var(--deep-forest); margin: 20px 0 10px;">Payout History</h3>
        ${(!payouts || payouts.length === 0) ? `
          <div style="background: #FAFAFA; padding: 14px; text-align: center; border-radius: var(--radius-sm); color: var(--secondary-text); font-size: 0.85rem;">
            No settlements distributed yet. Automated engine runs every 24 hours.
          </div>
        ` : `
          <div class="table-responsive">
            <table class="tx-table">
              <thead><tr><th>Date</th><th>Type</th><th>Amount</th></tr></thead>
              <tbody>
                ${payouts.map(p => `
                  <tr>
                    <td>${formatDate(p.payout_date)}</td>
                    <td style="text-transform: capitalize;">${p.payout_type.replace('_', ' ')}</td>
                    <td style="color: var(--success-green); font-weight: 700;">${formatCurrency(p.amount)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `}
      `;
    }

    loadInvDetails();
  </script>
</body>
</html>
