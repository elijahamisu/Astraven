<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at center, var(--cream-white) 0%, #F5EEDB 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--metallic-gold);
      box-shadow: var(--shadow-lg);
      padding: 36px 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .form-control {
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="index.html" class="brand-wordmark" style="font-size: 2rem; text-decoration: none; display: inline-block;">ASTRAVEN</a>
        <p style="color: var(--secondary-text); font-size: 0.9rem; margin-top: 4px;">Set new account password</p>
      </div>

      <div id="alertBanner" class="alert-banner"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password (Min. 8 characters)</label>
          <input type="password" id="newPassword" class="form-control" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat new password" required minlength="8" autocomplete="new-password">
        </div>

        <button type="submit" id="submitBtn" class="btn-gold" style="width: 100%; padding: 13px;">
          Update Password
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabase-client.js';

    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');

    async function checkRecoveryState() {
      if (!supabase) return;
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        alertBanner.textContent = 'Invalid or expired recovery session. Please request a new recovery link.';
        alertBanner.className = 'alert-banner error';
        form.style.display = 'none';
      }
    }
    checkRecoveryState();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        alertBanner.textContent = 'Password must be at least 8 characters long.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      if (newPassword !== confirmPassword) {
        alertBanner.textContent = 'Passwords do not match.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating...';

      try {
        const { error } = await supabase.auth.updateUser({ password: newPassword });
        if (error) {
          alertBanner.textContent = error.message;
          alertBanner.className = 'alert-banner error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }

        alertBanner.textContent = 'Password updated successfully! Redirecting to sign in...';
        alertBanner.className = 'alert-banner success';

        setTimeout(async () => {
          await supabase.auth.signOut();
          window.location.href = 'login.html';
        }, 1500);

      } catch (err) {
        alertBanner.textContent = 'Failed to update password.';
        alertBanner.className = 'alert-banner error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    });
  </script>
</body>
</html>
