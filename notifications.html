<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notification Centre | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .notif-wrap { max-width: 680px; margin: 0 auto; }
    .notif-card-item {
      background: var(--white);
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      box-shadow: var(--shadow-sm);
    }
    .notif-card-item.unread {
      background: #FFFDF5;
      border-left: 4px solid var(--bright-gold);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="notif-wrap">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <div>
            <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary-green); text-transform: uppercase;">✦ Member Activity</span>
            <h1 class="font-heading" style="font-size: 1.8rem;">Notifications</h1>
          </div>
          <button id="markAllBtn" class="btn-emerald" style="padding: 8px 16px; font-size: 0.82rem;">
            Mark All as Read
          </button>
        </div>

        <div id="notifsContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading alerts...</p>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatDate } from './shared/formatters.js';

    let currentUserId = null;

    async function loadNotifications() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;
      currentUserId = session.user.id;

      const { data: notifs, error } = await supabase
        .from('notifications')
        .select('*')
        .eq('user_id', currentUserId)
        .order('created_at', { ascending: false })
        .limit(50);

      const container = document.getElementById('notifsContainer');

      if (error || !notifs || notifs.length === 0) {
        container.innerHTML = `
          <div class="astra-card" style="text-align: center; padding: 40px;">
            <p style="color: var(--secondary-text);">You have no notifications on file.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = notifs.map(n => `
        <div class="notif-card-item ${!n.is_read ? 'unread' : ''}" id="notif-${n.id}">
          <div style="flex: 1; min-width: 0;">
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
              <span class="badge-status ${n.type === 'wallet' ? 'badge-completed' : (n.type === 'security' ? 'badge-failed' : 'badge-pending')}" style="font-size: 0.68rem;">
                ${n.type.toUpperCase()}
              </span>
              <strong style="color: var(--deep-forest); font-size: 0.95rem;">${escapeHtml(n.title)}</strong>
            </div>
            <p style="font-size: 0.88rem; color: var(--primary-text); line-height: 1.45; margin-bottom: 6px;">
              ${escapeHtml(n.message)}
            </p>
            <span style="font-size: 0.75rem; color: var(--secondary-text);">${formatDate(n.created_at)}</span>
          </div>
          ${!n.is_read ? `
            <button class="btn-emerald" style="padding: 4px 10px; font-size: 0.75rem; white-space: nowrap;" onclick="markRead('${n.id}')">
              Mark Read
            </button>
          ` : ''}
        </div>
      `).join('');
    }

    window.markRead = async function(id) {
      const { error } = await supabase
        .from('notifications')
        .update({ is_read: true })
        .eq('id', id)
        .eq('user_id', currentUserId);

      if (!error) {
        const item = document.getElementById(`notif-${id}`);
        if (item) {
          item.classList.remove('unread');
          item.querySelector('button')?.remove();
        }
      }
    };

    document.getElementById('markAllBtn').addEventListener('click', async () => {
      const { data, error } = await supabase.rpc('mark_all_notifications_read', {
        p_user_id: currentUserId
      });
      if (!error && data.success) {
        loadNotifications();
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    loadNotifications();
  </script>
</body>
</html>
