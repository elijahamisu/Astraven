<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .notif-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .notif-item {
      padding: 16px;
      border-bottom: 1px solid #ECECEC;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      min-width: 0;
    }
    .notif-item.unread {
      background: #FBF9F1;
      border-left: 4px solid var(--metallic-gold);
    }
    .notif-item:last-child { border-bottom: none; }
    .notif-body-wrap {
      flex: 1;
      min-width: 0;
    }
    .notif-title {
      font-weight: 700;
      color: var(--deep-forest);
      font-size: 0.95rem;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .notif-msg {
      font-size: 0.88rem;
      color: var(--primary-text);
      line-height: 1.4;
      word-break: break-word;
    }
    .notif-meta {
      font-size: 0.75rem;
      color: var(--secondary-text);
      margin-top: 6px;
    }
    .btn-mark {
      background: none;
      border: 1px solid #D1D5DB;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--secondary-text);
      white-space: nowrap;
      flex-shrink: 0;
      touch-action: manipulation;
    }
    .btn-mark:hover {
      border-color: var(--primary-green);
      color: var(--primary-green);
    }
    .empty-state {
      padding: 40px 16px;
      text-align: center;
      color: var(--secondary-text);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div class="notif-header">
        <h1 class="font-heading" style="font-size: clamp(1.4rem, 4vw, 2rem);">Notification Centre</h1>
        <button id="markAllBtn" class="btn-emerald" style="padding: 8px 14px; font-size: 0.85rem;">
          Mark All Read
        </button>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;" id="notifListContainer">
        <div class="empty-state">Loading your notifications...</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatDate } from './shared/formatters.js';

    let currentUserId = null;

    async function loadNotifications() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;
      currentUserId = session.user.id;

      const { data: notifs, error } = await supabase
        .from('notifications')
        .select('*')
        .eq('user_id', currentUserId)
        .order('created_at', { ascending: false })
        .limit(30);

      const container = document.getElementById('notifListContainer');

      if (error || !notifs || notifs.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2.2rem; margin-bottom: 8px; opacity: 0.6;">🔔</div>
            <p>You have no notifications at this time.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = notifs.map(n => `
        <div class="notif-item ${!n.is_read ? 'unread' : ''}" id="notif-${n.id}">
          <div class="notif-body-wrap">
            <div class="notif-title">${n.title}</div>
            <div class="notif-msg">${n.message}</div>
            <div class="notif-meta">${formatDate(n.created_at)}</div>
          </div>
          ${!n.is_read ? `
            <button class="btn-mark" onclick="markAsRead('${n.id}')">Mark Read</button>
          ` : ''}
        </div>
      `).join('');
    }

    window.markAsRead = async function(id) {
      const { error } = await supabase
        .from('notifications')
        .update({ is_read: true })
        .eq('id', id)
        .eq('user_id', currentUserId);

      if (!error) {
        const el = document.getElementById(`notif-${id}`);
        if (el) {
          el.classList.remove('unread');
          const btn = el.querySelector('.btn-mark');
          if (btn) btn.remove();
        }
      }
    };

    document.getElementById('markAllBtn').addEventListener('click', async () => {
      const { error } = await supabase
        .from('notifications')
        .update({ is_read: true })
        .eq('user_id', currentUserId)
        .eq('is_read', false);

      if (!error) loadNotifications();
    });

    loadNotifications();
  </script>
</body>
</html>
