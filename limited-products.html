<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limited Capacity Products | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .page-title { font-size: clamp(1.4rem, 4vw, 2rem); color: var(--deep-forest); }
    .grid-ltd {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
    }
    @media (min-width: 650px) {
      .grid-ltd { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .capacity-bar-wrap {
      width: 100%;
      height: 8px;
      background: #E5E7EB;
      border-radius: 9999px;
      overflow: hidden;
      margin: 8px 0;
    }
    .capacity-bar-fill {
      height: 100%;
      background: var(--metallic-gold);
      border-radius: 9999px;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--error-red); text-transform: uppercase;">✦ Strict Quota Allocations</span>
        <h1 class="page-title">Limited-Capacity Flights</h1>
        <p style="color: var(--secondary-text); font-size: 0.9rem;">
          Special flight syndicates capped by strict investor allocations. Once filled, purchases close permanently.
        </p>
      </div>

      <div class="grid-ltd" id="limitedContainer">
        <div class="astra-card" style="text-align: center; padding: 30px;">Loading flight quotas...</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initUserNavigation } from './shared/user-navigation.js';
    import { requireAuth, supabase } from './shared/supabase-client.js';
    import { formatCurrency } from './shared/formatters.js';

    async function loadLimited() {
      await initUserNavigation({ requireSession: true });
      const session = await requireAuth();
      if (!session) return;

      const { data: category } = await supabase
        .from('product_categories')
        .select('id')
        .eq('slug', 'limited')
        .single();

      if (!category) return;

      const { data: products } = await supabase
        .from('products')
        .select('*')
        .eq('category_id', category.id)
        .is('archived_at', null)
        .order('created_at', { ascending: false });

      const container = document.getElementById('limitedContainer');

      if (!products || products.length === 0) {
        container.innerHTML = `<div class="astra-card" style="grid-column: 1 / -1; text-align: center; padding: 30px;">No limited-capacity flight products available.</div>`;
        return;
      }

      container.innerHTML = products.map(prod => {
        const isFull = prod.max_capacity && prod.current_capacity >= prod.max_capacity;
        const percent = prod.max_capacity ? Math.min(100, Math.round((prod.current_capacity / prod.max_capacity) * 100)) : 0;

        return `
          <div class="astra-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span style="font-weight: 700; font-size: 0.75rem; color: var(--primary-green);">${prod.code}</span>
              <span class="badge-status ${isFull ? 'badge-failed' : 'badge-completed'}">
                ${isFull ? 'Sold Out' : 'Slots Open'}
              </span>
            </div>

            <h2 style="font-size: 1.25rem; color: var(--deep-forest); margin-bottom: 4px;">${prod.name}</h2>
            <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--primary-green); margin-bottom: 12px;">
              ${formatCurrency(prod.price)}
            </div>

            ${(() => {
              const price = Number(prod.price) || 0;
              const total = Number(prod.total_payout) || 0;
              const profit = total - price;
              const days = Number(prod.duration_days) || 0;
              const daily = Number(prod.daily_income) || 0;
              const yieldPct = price > 0 ? Math.round((profit / price) * 100) : 0;
              const cell = (label, value, color = 'var(--deep-forest)') => `
                <div style="background: rgba(0,0,0,0.03); border-radius: 10px; padding: 10px;">
                  <div style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--secondary-text);">${label}</div>
                  <div style="font-weight: 700; font-size: 0.95rem; color: ${color}; margin-top: 2px;">${value}</div>
                </div>`;
              return `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;">
                  ${cell('Duration', `${days} Day${days === 1 ? '' : 's'}`)}
                  ${cell(prod.payout_type === 'maturity' || daily <= 0 ? 'Payout' : 'Daily Income',
                         prod.payout_type === 'maturity' || daily <= 0 ? 'At maturity' : formatCurrency(daily), 'var(--metallic-gold)')}
                  ${cell('Total Return', formatCurrency(total))}
                  ${cell('Profit', `+${formatCurrency(profit)} (${yieldPct}%)`, 'var(--success-green)')}
                </div>`;
            })()}

            <div style="font-size: 0.85rem; margin-bottom: 14px;">
              <div style="display: flex; justify-content: space-between; color: var(--secondary-text); font-size: 0.8rem;">
                <span>Quota Reserved</span>
                <strong>${prod.current_capacity} / ${prod.max_capacity || '∞'} Seats</strong>
              </div>
              <div class="capacity-bar-wrap">
                <div class="capacity-bar-fill" style="width: ${percent}%; background: ${isFull ? 'var(--error-red)' : 'var(--metallic-gold)'};"></div>
              </div>
            </div>

            <div>
              ${isFull ? `
                <button class="btn-emerald" disabled style="width: 100%; opacity: 0.6; cursor: not-allowed;">Product has reached its maximum capacity.</button>
              ` : `
                <a href="invest.html?product_id=${prod.id}" class="btn-gold" style="width: 100%;">Reserve Capacity</a>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    loadLimited();
  </script>
</body>
</html>
