<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Announcements | ASTRAVEN Admin</title>
  <script type="module" crossorigin src="/assets/admin/announcements-DktlTuIR.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-DdZx35sm.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-navigation-Ck9BqSXZ.js">
  <link rel="modulepreload" crossorigin href="/assets/formatters-kkpPVsns.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 24px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Platform Broadcasts</span>
        <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Announcements Manager</h1>
      </div>

      <form class="astra-card" id="annForm" style="margin-bottom: 24px;">
        <h2 style="font-size: 1.15rem; color: var(--deep-forest); margin-bottom: 12px;">Publish New Broadcast</h2>
        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
          <input type="text" id="annTitle" class="form-control" placeholder="Announcement Title" required>
          <textarea id="annContent" class="form-control" placeholder="Broadcast message..." required style="min-height: 80px;"></textarea>
          <select id="annCategory" class="form-control">
            <option value="General">General</option>
            <option value="Maintenance">Maintenance</option>
            <option value="Product Updates">Product Updates</option>
          </select>
        </div>
        <button type="submit" class="btn-gold" style="padding: 10px 18px; font-size: 0.85rem;">Broadcast Notice</button>
      </form>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="annListContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading notices...</p>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
