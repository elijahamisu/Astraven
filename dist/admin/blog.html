<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Proof Moderation | ASTRAVEN Admin</title>
  <style>
    .page-header-wrap { margin-bottom: 20px; }
    .header-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--metallic-gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-block;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--deep-forest);
      line-height: 1.2;
    }

    /* Filter Tabs */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }
    .filter-btn {
      padding: 10px 18px;
      border-radius: 9999px;
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      background: var(--white);
      color: var(--deep-forest);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .filter-btn.active {
      background: var(--deep-forest);
      color: var(--bright-gold);
      border-color: var(--metallic-gold);
      box-shadow: 0 2px 8px rgba(0, 43, 26, 0.2);
    }

    /* Mobile Cards Feed */
    .posts-mod-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mod-card {
      background: var(--white);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(0, 43, 26, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .mod-card:hover {
      border-color: var(--metallic-gold);
      box-shadow: 0 6px 18px rgba(0, 43, 26, 0.12);
    }

    .card-top-bar {
      background: #FAFAFA;
      padding: 12px 16px;
      border-bottom: 1px solid #ECECEC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .author-handle {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--deep-forest);
    }
    .post-date {
      font-size: 0.75rem;
      color: var(--secondary-text);
      display: block;
      margin-top: 2px;
    }

    .card-body {
      padding: 16px;
    }
    .post-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--deep-forest);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .post-content {
      font-size: 0.9rem;
      color: var(--primary-text);
      line-height: 1.5;
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Inline Proof Image */
    .proof-image-container {
      margin: 12px 0;
      border: 1px solid #E5E7EB;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: #000;
    }
    .proof-img {
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      cursor: pointer;
      display: block;
    }
    .proof-caption {
      font-size: 0.72rem;
      color: var(--secondary-text);
      padding: 6px 10px;
      background: #FAFAFA;
      text-align: center;
      display: block;
      border-top: 1px solid #E5E7EB;
    }

    /* Action Buttons Row */
    .card-actions-row {
      padding: 12px 16px;
      background: #FFFDF8;
      border-top: 1px solid #ECECEC;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-approve-mod {
      flex: 2;
      min-width: 130px;
      background: linear-gradient(135deg, var(--bright-gold) 0%, var(--metallic-gold) 100%);
      color: var(--deep-forest);
      border: 1px solid var(--metallic-gold);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-reject-mod {
      flex: 1;
      min-width: 90px;
      background: rgba(0, 43, 26, 0.08);
      color: var(--deep-forest);
      border: 1px solid rgba(0, 43, 26, 0.25);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-delete-mod {
      flex: 1;
      min-width: 90px;
      background: rgba(215, 25, 32, 0.08);
      color: var(--error-red);
      border: 1px solid var(--error-red);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-delete-mod:hover {
      background: var(--error-red);
      color: var(--white);
    }

    .empty-state-box {
      background: var(--white);
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
      border-radius: var(--radius-md);
      padding: 48px 20px;
      text-align: center;
      color: var(--secondary-text);
    }

    @media (min-width: 768px) {
      .posts-mod-feed {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/admin/blog-NYtKp-_d.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-DdZx35sm.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-navigation-Ck9BqSXZ.js">
  <link rel="modulepreload" crossorigin href="/assets/formatters-kkpPVsns.js">
  <link rel="modulepreload" crossorigin href="/assets/usernames-B9ARDZtj.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="page-header-wrap">
        <span class="header-tag">✦ Content Governance</span>
        <h1 class="header-title font-heading">Community Proof Moderation</h1>
      </div>

      <!-- Filter Tabs -->
      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All Posts</button>
        <button class="filter-btn" data-filter="pending">Pending Review</button>
        <button class="filter-btn" data-filter="approved">Approved &amp; Live</button>
        <button class="filter-btn" data-filter="rejected">Rejected</button>
      </div>

      <!-- Mobile-first Cards Feed -->
      <div class="posts-mod-feed" id="postsModFeed">
        <div class="empty-state-box">
          <p>Loading community submissions...</p>
        </div>
      </div>
    </main>
  </div>

  <div id="commentsModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; align-items: center; justify-content: center; padding: 16px;" onclick="if (event.target === this) closeComments()">
    <div style="background: var(--white); border-radius: var(--radius-md); width: 100%; max-width: 560px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden;">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #ECECEC;">
        <div style="min-width: 0;"><span style="font-size: 0.72rem; color: var(--metallic-gold); font-weight: 700;">COMMENTS</span><h3 id="cmTitle" style="font-size: 1rem; color: var(--deep-forest); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></h3></div>
        <button onclick="closeComments()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--secondary-text);">&times;</button>
      </div>
      <div id="cmList" style="padding: 4px 16px 12px; overflow-y: auto;"></div>
    </div>
  </div>

</body>
</html>
