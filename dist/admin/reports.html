<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Reports | ASTRAVEN Admin</title>
  <style>
    .metrics-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .m-card { background: var(--white); border: 1.5px solid rgba(212, 175, 55, 0.35); border-radius: var(--radius-sm); padding: 18px; }
  </style>
  <script type="module" crossorigin src="/assets/admin/reports-CnXQeXQB.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-DdZx35sm.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-navigation-Ck9BqSXZ.js">
  <link rel="modulepreload" crossorigin href="/assets/formatters-kkpPVsns.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 10px;">
        <div>
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Balance Sheet Analytics</span>
          <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Platform Financial Reports</h1>
        </div>
        <button id="exportCsvBtn" class="btn-gold" style="padding: 10px 18px; font-size: 0.85rem;">Download Ledger CSV</button>
      </div>

      <div class="metrics-row">
        <div class="m-card">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text);">Cumulative Deposited</span>
          <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--primary-green); margin-top: 4px;" id="repTotalDep">₦0.00</div>
        </div>
        <div class="m-card">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text);">Cumulative Withdrawn</span>
          <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--error-red); margin-top: 4px;" id="repTotalWith">₦0.00</div>
        </div>
        <div class="m-card">
          <span style="font-size: 0.75rem; text-transform: uppercase; color: var(--secondary-text);">Total Net Liquidity</span>
          <div style="font-size: 1.5rem; font-family: var(--font-heading); font-weight: 700; color: var(--deep-forest); margin-top: 4px;" id="repNetLiquidity">₦0.00</div>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
