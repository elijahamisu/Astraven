<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Permissions | ASTRAVEN Admin</title>
  <style>
    .staff-wrap { max-width: 640px; margin: 0 auto; }
  </style>
  <script type="module" crossorigin src="/assets/admin/staff-H5QWFJba.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-DdZx35sm.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-navigation-Ck9BqSXZ.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="staff-wrap">
        <div style="margin-bottom: 24px;">
          <span style="font-size: 0.8rem; font-weight: 700; color: var(--metallic-gold); text-transform: uppercase;">✦ Role-Based Access Control</span>
          <h1 class="font-heading" style="font-size: 2rem; color: var(--deep-forest);">Staff Role Management</h1>
        </div>

        <form class="astra-card" id="staffRoleForm" style="margin-bottom: 24px;">
          <h2 style="font-size: 1.15rem; color: var(--deep-forest); margin-bottom: 12px;">Assign Staff Clearance</h2>
          <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px;">
            <input type="text" id="targetStaffId" class="form-control" placeholder="Target User UUID" required>
            <select id="staffRole" class="form-control" required>
              <option value="support_agent">Support Agent (Helpdesk Clearance)</option>
              <option value="admin">Administrator (Financial & Product Clearance)</option>
              <option value="superadmin">Superadministrator (Full Clearance)</option>
              <option value="user">Revoke to Standard User</option>
            </select>
          </div>
          <button type="submit" class="btn-gold" style="width: 100%; padding: 12px;">Apply Role</button>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
