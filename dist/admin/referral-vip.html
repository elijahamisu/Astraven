<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral VIP Tiers | ASTRAVEN Admin</title>
  <style>
    .page-header-wrap { margin-bottom: 20px; }
    .header-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--metallic-gold);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-block;
      margin-bottom: 4px;
    }
    .header-title {
      font-size: clamp(1.5rem, 5vw, 2.1rem);
      color: var(--deep-forest);
      line-height: 1.2;
    }

    /* Mobile Tier Cards Feed */
    .tiers-feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tier-card {
      background: var(--white);
      border: 1.5px solid rgba(212, 175, 55, 0.35);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 14px rgba(0, 43, 26, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tier-card:hover {
      border-color: var(--metallic-gold);
      box-shadow: 0 6px 18px rgba(0, 43, 26, 0.12);
    }

    .tier-top-bar {
      background: #FAFAFA;
      padding: 12px 16px;
      border-bottom: 1px solid #ECECEC;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tier-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--metallic-gold);
      background: var(--deep-forest);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .tier-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--deep-forest);
    }

    .tier-body {
      padding: 16px;
    }

    /* Salary Highlight Box */
    .salary-box {
      background: linear-gradient(135deg, var(--deep-forest) 0%, var(--card-green) 100%);
      border: 1px solid var(--metallic-gold);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--white);
      margin-bottom: 14px;
    }
    .salary-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--soft-gold);
      letter-spacing: 0.05em;
      margin-bottom: 2px;
      display: block;
    }
    .salary-val {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--bright-gold);
    }

    /* Requirements Grid */
    .reqs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--cream-white);
      border: 1px solid #E5E7EB;
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-bottom: 14px;
      text-align: center;
    }
    .req-item-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      color: var(--secondary-text);
      display: block;
      margin-bottom: 2px;
    }
    .req-item-val {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--deep-forest);
    }

    /* Action Button */
    .btn-edit-tier {
      width: 100%;
      background: linear-gradient(135deg, var(--bright-gold) 0%, var(--metallic-gold) 100%);
      color: var(--deep-forest);
      border: 1px solid var(--metallic-gold);
      border-radius: var(--radius-sm);
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(212, 175, 55, 0.25);
    }
    .btn-edit-tier:hover {
      filter: brightness(1.06);
    }

    /* Edit Tier Modal */
    .tier-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 43, 26, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1200;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .tier-modal.active { display: flex; }
    .tier-modal-box {
      background: var(--white);
      border: 1.5px solid var(--metallic-gold);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group label { font-size: 0.85rem; font-weight: 700; color: var(--deep-forest); }
    .form-control {
      padding: 10px 12px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }

    .empty-state-box {
      background: var(--white);
      border: 1.5px dashed rgba(212, 175, 55, 0.4);
      border-radius: var(--radius-md);
      padding: 48px 20px;
      text-align: center;
      color: var(--secondary-text);
    }

    @media (min-width: 768px) {
      .tiers-feed {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }
    }
  </style>
  <script type="module" crossorigin src="/assets/admin/referral-vip-BeSbHVn0.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BCUvSBAr.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/admin-navigation-CfdeLVZw.js">
  <link rel="modulepreload" crossorigin href="/assets/formatters-kkpPVsns.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="adminNavigationContainer"></div>

    <main class="main-content">
      <div class="page-header-wrap">
        <span class="header-tag">✦ Leadership Governance</span>
        <h1 class="header-title font-heading">Referral VIP Requirements</h1>
      </div>

      <!-- Mobile-First Tiers Stack -->
      <div class="tiers-feed" id="tiersFeed">
        <div class="empty-state-box">
          <p>Loading VIP tier requirements...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Interactive Edit Tier Modal -->
  <div class="tier-modal" id="tierModal">
    <div class="tier-modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2 style="font-size: 1.25rem; color: var(--deep-forest);" id="modalHeaderTitle">Edit VIP Tier</h2>
        <button id="closeModalBtn" type="button" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--secondary-text); padding: 4px;">&times;</button>
      </div>

      <form id="editTierForm">
        <input type="hidden" id="editLevel">

        <div class="form-group">
          <label for="editName">Tier Name</label>
          <input type="text" id="editName" class="form-control" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div class="form-group">
            <label for="editDaily">Daily Salary (₦)</label>
            <input type="number" id="editDaily" class="form-control" min="0" step="any" required>
          </div>
          <div class="form-group">
            <label for="editMonthly">Monthly Salary (₦)</label>
            <input type="number" id="editMonthly" class="form-control" min="0" step="any" required>
          </div>
        </div>

        <div class="form-group">
          <label for="editDownlines">Required Active Downlines</label>
          <input type="number" id="editDownlines" class="form-control" min="1" required>
        </div>

        <div class="form-group">
          <label for="editTeam">Required Team Deposit Volume (₦)</label>
          <input type="number" id="editTeam" class="form-control" min="0" step="any" required>
        </div>

        <div class="form-group">
          <label for="editPersonal">Required Personal Deposit (₦)</label>
          <input type="number" id="editPersonal" class="form-control" min="0" step="any" required>
        </div>

        <button type="submit" id="saveTierBtn" class="btn-gold" style="width: 100%; padding: 13px; margin-top: 10px;">
          Save Tier Configuration
        </button>
      </form>
    </div>
  </div>

</body>
</html>
