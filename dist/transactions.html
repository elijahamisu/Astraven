<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Ledger | ASTRAVEN</title>
  <style>
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 4px; }
    .filter-btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(212, 175, 55, 0.4);
      background: var(--white);
      color: var(--deep-forest);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-btn.active { background: var(--dark-emerald); color: var(--bright-gold); border-color: var(--bright-gold); }
    .tx-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      min-width: 520px;
    }
    .tx-table th, .tx-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ECECEC;
    }
    .tx-table th {
      background: #FAFAFA;
      color: var(--secondary-text);
      font-size: 0.72rem;
      text-transform: uppercase;
    }
  </style>
  <script type="module" crossorigin src="/assets/transactions-CVDKJoN3.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BCUvSBAr.js">
  <link rel="modulepreload" crossorigin href="/assets/site-settings-CsXfhtzc.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/user-navigation-FagTkAhj.js">
  <link rel="modulepreload" crossorigin href="/assets/formatters-kkpPVsns.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>

    <main class="main-content">
      <div style="margin-bottom: 20px;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary-green); text-transform: uppercase;">✦ Financial Ledger</span>
        <h1 class="font-heading" style="font-size: 1.8rem;">All Transactions</h1>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="deposit">Deposits</button>
        <button class="filter-btn" data-filter="withdrawal">Withdrawals</button>
        <button class="filter-btn" data-filter="investment">Investments</button>
        <button class="filter-btn" data-filter="reward">Rewards</button>
      </div>

      <div class="astra-card" style="padding: 0; overflow: hidden;">
        <div class="table-responsive" id="txContainer">
          <p style="text-align: center; color: var(--secondary-text); padding: 40px;">Loading financial transactions...</p>
        </div>
      </div>
    </main>
  </div>

</body>
</html>
