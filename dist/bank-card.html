<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bind Bank Card | ASTRAVEN</title>
  <style>
    .wrap { max-width: 560px; margin: 0 auto; }
    .bank-visual { background: linear-gradient(135deg, var(--deep-forest) 0%, var(--card-green) 100%); border: 1.5px solid var(--metallic-gold); border-radius: 18px; padding: 22px; color: var(--white); margin-bottom: 22px; box-shadow: var(--shadow-md); min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
    .bank-visual .bv-bank { font-size: 1rem; font-weight: 700; color: var(--bright-gold); }
    .bank-visual .bv-num { font-family: monospace; font-size: 1.45rem; letter-spacing: 0.12em; margin: 14px 0 8px; }
    .bank-visual .bv-name { font-size: 0.85rem; text-transform: uppercase; color: #D1D5DB; letter-spacing: .05em; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .form-control { padding: 12px 14px; border: 1px solid #D1D5DB; border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--cream-white); }
    .alert-banner { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 18px; font-size: 0.9rem; display: none; }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
  </style>
  <script type="module" crossorigin src="/assets/bank-card-B2AhwdBP.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/supabase-client-BCUvSBAr.js">
  <link rel="modulepreload" crossorigin href="/assets/site-settings-1MPb4jkf.js">
  <link rel="modulepreload" crossorigin href="/assets/mobile-cards-DX-1T3ZF.js">
  <link rel="modulepreload" crossorigin href="/assets/user-navigation-C7tDwe5x.js">
  <link rel="modulepreload" crossorigin href="/assets/mgm-banks-DGIe8LZ_.js">
  <link rel="stylesheet" crossorigin href="/assets/supabase-client-EgumnwMA.css">
</head>
<body>
  <div class="app-container">
    <div id="navigationContainer"></div>
    <main class="main-content">
      <div class="wrap">
        <h1 class="font-heading" style="margin-bottom: 6px; font-size: 1.8rem;">Bind Bank Card</h1>
        <p style="color: var(--secondary-text); font-size: 0.9rem; margin-bottom: 20px;">Save your payout account once. It fills in automatically every time you withdraw.</p>

        <div class="bank-visual" id="bankVisual">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span class="bv-bank" id="bvBank">No card bound yet</span>
            <span style="font-size: 0.7rem; color: var(--soft-gold); letter-spacing: .1em;">ASTRAVEN</span>
          </div>
          <div class="bv-num" id="bvNum">•••• •••• ••</div>
          <div class="bv-name" id="bvName">Add your account below</div>
        </div>

        <div id="alertBanner" class="alert-banner"></div>

        <form class="astra-card" id="cardForm">
          <div class="form-group">
            <label for="bankCode">Bank</label>
            <select id="bankCode" class="form-control" required><option value="">Select your bank</option></select>
          </div>
          <div class="form-group">
            <label for="accountNumber">Account Number (10 digits)</label>
            <input type="text" id="accountNumber" class="form-control" inputmode="numeric" maxlength="10" placeholder="0123456789" required>
          </div>
          <div class="form-group">
            <label for="accountName">Account Name</label>
            <input type="text" id="accountName" class="form-control" maxlength="120" placeholder="Full name on the account" required>
          </div>
          <button type="submit" id="saveBtn" class="btn-gold" style="width: 100%; padding: 14px;">Bind Bank Card</button>
          <a href="withdraw.html" id="goWithdraw" class="btn-emerald" style="display: none; width: 100%; padding: 12px; margin-top: 10px; text-align: center; text-decoration: none; box-sizing: border-box;">Go to Withdraw</a>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
