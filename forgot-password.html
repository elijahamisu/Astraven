<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at center, var(--cream-white) 0%, #F5EEDB 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1.5px solid var(--metallic-gold);
      box-shadow: var(--shadow-lg);
      padding: 36px 28px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .form-control {
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: var(--cream-white);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <a href="index.html" class="brand-wordmark" style="font-size: 2rem; text-decoration: none; display: inline-block;">ASTRAVEN</a>
        <p style="color: var(--secondary-text); font-size: 0.9rem; margin-top: 4px;">Account recovery instructions</p>
      </div>

      <div id="alertBanner" class="alert-banner"></div>

      <form id="forgotForm">
        <div class="form-group">
          <label for="email">Account Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="submitBtn" class="btn-gold" style="width: 100%; padding: 13px;">
          Send Recovery Link
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
        Remembered password? <a href="login.html" style="color: var(--primary-green); font-weight: 700; text-decoration: none;">Return to Sign In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabase-client.js';
    import { isValidEmail } from './shared/validation.js';

    const form = document.getElementById('forgotForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!isValidEmail(email)) {
        alertBanner.textContent = 'Please enter a valid email address.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Dispatching Link...';

      try {
        const redirectUrl = `${window.location.origin}/reset-password.html`;
        await supabase.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });

        alertBanner.textContent = 'If an account matches this email, password recovery instructions have been dispatched. Please check your inbox and spam folder.';
        alertBanner.className = 'alert-banner success';
        form.reset();
      } catch (err) {
        alertBanner.textContent = 'Recovery service encountered an error.';
        alertBanner.className = 'alert-banner error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Recovery Link';
      }
    });
  </script>
</body>
</html>
