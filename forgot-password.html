<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ASTRAVEN</title>
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(circle at center, var(--cream-white) 0%, #F5EEDB 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--metallic-gold);
      box-shadow: var(--shadow-lg);
      padding: 40px 32px;
    }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-brand {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      color: var(--deep-forest);
      letter-spacing: 2px;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 8px;
    }
    .auth-subtitle { color: var(--secondary-text); font-size: 0.95rem; }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--deep-forest); }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #D1D5DB;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: var(--font-body);
      background: var(--cream-white);
    }
    .alert-banner {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
    .alert-banner.error { background: #FDE8E8; border: 1px solid var(--error-red); color: var(--error-red); display: block; }
    .alert-banner.success { background: #E6F8EF; border: 1px solid var(--success-green); color: var(--success-green); display: block; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--secondary-text); }
    .auth-footer a { color: var(--primary-green); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-brand">ASTRAVEN</a>
        <p class="auth-subtitle">Enter your email to receive recovery instructions</p>
      </div>

      <div id="alertBanner" class="alert-banner"></div>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email">Account Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required autocomplete="email">
        </div>

        <button type="submit" id="submitBtn" class="btn-gold" style="width: 100%;">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './shared/supabase-client.js';
    import { isValidEmail } from './shared/validation.js';

    const form = document.getElementById('forgotForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertBanner = document.getElementById('alertBanner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBanner.style.display = 'none';

      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!isValidEmail(email)) {
        alertBanner.textContent = 'Please enter a valid email address.';
        alertBanner.className = 'alert-banner error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending Link...';

      try {
        const redirectUrl = `${window.location.origin}/reset-password.html`;
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: redirectUrl
        });

        if (error) {
          alertBanner.textContent = error.message;
          alertBanner.className = 'alert-banner error';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
          return;
        }

        // Generic security notice (prevents email enumeration)
        alertBanner.textContent = 'If an account exists with this email address, password recovery instructions have been sent. Please check your inbox and spam folder.';
        alertBanner.className = 'alert-banner success';
        form.reset();
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      } catch (err) {
        alertBanner.textContent = 'An error occurred while requesting password reset.';
        alertBanner.className = 'alert-banner error';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
